<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物理シミュレーション教材</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      max-width: 100vw;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      line-height: 1.7;
      color: #222;
      background: #f7f7f7;
    }

    .page {
      width: min(860px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 40px;
    }

    header {
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid #d8d8d8;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      color: #555;
      font-size: 1rem;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.2rem;
      letter-spacing: 0;
    }

    .materials {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .material {
      padding: 16px 18px;
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      background: #fff;
    }

    .material-title {
      margin: 0 0 4px;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .material-note {
      margin: 0 0 10px;
      color: #666;
      font-size: 0.95rem;
    }

    .open-link {
      color: #115a9c;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .open-link:focus,
    .open-link:hover {
      color: #073b68;
    }

    footer {
      margin-top: 26px;
      padding-top: 14px;
      border-top: 1px solid #d8d8d8;
      color: #666;
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100vw - 24px, 860px);
        padding-top: 22px;
      }

      h1 {
        font-size: 1.65rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>物理シミュレーション教材</h1>
      <p class="lead">高校物理の授業で使用するシミュレーション教材です。<br>Chromebookなどのブラウザで開いて使用してください。</p>
    </header>

    <main>
      <h2>教材一覧</h2>
      <ul class="materials">
        <li class="material">
          <p class="material-title">摩擦角</p>
          <p class="material-note">斜面上の物体にはたらく摩擦力と滑り出す角度を観察します。</p>
          <a class="open-link" href="simulations/01_friction_angle/index.html">開く</a>
        </li>

        <li class="material">
          <p class="material-title">ドップラー効果</p>
          <p class="material-note">動く音源と音の波面を観察します。</p>
          <a class="open-link" href="simulations/12_moving_sound_source_wave/index.html">開く</a>
        </li>

        <li class="material">
          <p class="material-title">薄膜干渉</p>
          <p class="material-note">膜の厚さが変わると、反射光の見え方がどう変わるかを観察します。</p>
          <a class="open-link" href="simulations/13_thin_film_interference_gpt56/index.html">開く</a>
        </li>
      </ul>
    </main>

    <footer>
      <p>掲載する教材は、準備できたものから順に追加します。</p>
    </footer>
  </div>
</body>
</html>
