<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>誘導電流の向きはどのように決まるのだろう？</title>
  <style>
    :root {
      color-scheme: light;
      --navy-1: #f4f6f8;
      --navy-2: #f4f6f8;
      --panel-border: #d4dbe2;
      --panel-text: #0d1f31;
      --blue: #176fb8;
      --north: #e22a23;
      --south: #2365bd;
      --current: #ffe668;
      --induced: #72e387;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      height: 100vh;
      overflow: hidden;
      color: var(--panel-text);
      background: #f4f6f8;
      font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    }

    .title-bar {
      height: 66px;
      display: grid;
      place-items: center;
      padding: 0 18px;
      color: #0b1f33;
      background: linear-gradient(135deg, var(--navy-1), var(--navy-2));
      box-shadow: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.55vw, 35px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      text-shadow: none;
    }

    .workspace {
      width: 100%;
      max-width: 100vw;
      height: calc(100vh - 66px);
      max-height: calc(100vh - 66px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      gap: 12px;
      padding: 12px;
      background: #f4f6f8;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #d4dbe2;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 34, 50, 0.08);
    }

    #simulation {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: auto;
      padding: 12px 10px 10px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 34, 50, 0.08);
    }

    .drag-hint {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
    }

    .drag-symbol {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 8px;
      color: #607080;
      font-size: 27px;
      line-height: 1;
    }

    .drag-symbol .hand {
      color: #0d1f31;
      font-size: 31px;
      transform: translateY(3px);
    }

    .display-options {
      overflow: hidden;
      border: 1px solid #d4dbe2;
      border-radius: 12px;
      background: #ffffff;
    }

    .option-row {
      min-height: 54px;
      display: grid;
      grid-template-columns: 21px 1fr 40px;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    .option-row + .option-row {
      border-top: 1px solid #dce2e7;
    }

    .option-row input {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .option-row:focus-within {
      outline: 3px solid rgba(23, 111, 184, 0.25);
      outline-offset: -3px;
    }

    .sample-icon {
      width: 40px;
      height: 27px;
      display: block;
    }

    .panel-divider {
      width: 100%;
      height: 1px;
      margin: 12px 0;
      border: 0;
      background: #d4dbe2;
    }

    .pole-heading {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
    }

    .pole-switch {
      width: min(100%, 190px);
      height: 52px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-self: center;
      overflow: hidden;
      padding: 0;
      border: 3px solid #33485c;
      border-radius: 10px;
      background: #fff;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(16, 34, 50, 0.14);
    }

    .pole-switch:hover {
      filter: brightness(1.04);
    }

    .pole-switch:focus-visible,
    .reset-button:focus-visible {
      outline: 4px solid rgba(23, 111, 184, 0.3);
      outline-offset: 3px;
    }

    .pole-half {
      height: 100%;
      display: grid;
      place-items: center;
      font: 700 25px/1 system-ui, sans-serif;
      text-shadow: 0 2px 2px rgba(0, 0, 0, 0.25);
    }

    .pole-half.north {
      background: linear-gradient(#f14438, #d81313);
    }

    .pole-half.south {
      background: linear-gradient(#377bd2, #174fa1);
    }

    .reset-button {
      min-height: 44px;
      margin-top: auto;
      border: 2px solid var(--blue);
      border-radius: 10px;
      color: #176fb8;
      background: #ffffff;
      font: 700 18px/1 "Yu Gothic UI", "Yu Gothic", system-ui, sans-serif;
      cursor: pointer;
    }

    .reset-button:hover {
      background: #eef5fb;
    }

    .reset-icon {
      display: inline-block;
      margin-right: 6px;
      font: 700 24px/1 system-ui, sans-serif;
      vertical-align: -2px;
    }

    .flux-line {
      fill: none;
      stroke: #5f7f99;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flux-line.outer {
      opacity: 0.74;
    }

    .flux-line.edge-extension {
      opacity: 0.62;
    }

    .flux-line.through-coil {
      opacity: 0.86;
    }

    .flux-line.axial {
      opacity: 0.88;
    }

    .flux-arrow-guide {
      fill: none;
      stroke: transparent;
      stroke-width: 1;
    }

    .wire-segment {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #magnet {
      cursor: grab;
      touch-action: none;
      outline: none;
    }

    #magnet.dragging {
      cursor: grabbing;
    }

    #magnet:focus-visible .magnet-focus {
      opacity: 1;
    }

    .current-arrow {
      fill: var(--current);
      stroke: #5c4e00;
      stroke-width: 1.6;
      stroke-linejoin: round;
      filter: url(#smallShadow);
    }

    #fluxLayer,
    #currentArrowLayer,
    #inducedFieldLayer {
      transition: opacity 80ms linear;
    }

    @media (max-width: 900px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .workspace {
        height: auto;
        max-height: none;
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 540px;
      }

      .control-panel {
        display: grid;
        grid-template-columns: minmax(210px, 1fr) minmax(210px, 1fr);
        gap: 12px 18px;
      }

      .drag-hint,
      .drag-symbol,
      .display-options,
      .panel-divider {
        grid-column: 1;
      }

      .pole-heading,
      .pole-switch,
      .reset-button {
        grid-column: 2;
      }

      .pole-heading {
        align-self: end;
      }

      .reset-button {
        width: 100%;
        margin-top: 8px;
      }
    }

    @media (max-width: 560px) {
      .title-bar {
        height: auto;
        min-height: 62px;
        padding: 10px 14px;
      }

      .workspace {
        padding: 8px;
      }

      .stage {
        min-height: 430px;
      }

      .control-panel {
        display: flex;
      }
    }

    @media (max-height: 670px) and (min-width: 901px) {
      .title-bar {
        height: 56px;
      }

      .workspace {
        height: calc(100vh - 56px);
        max-height: calc(100vh - 56px);
        padding: 8px;
        gap: 8px;
      }

      .control-panel {
        padding: 12px;
      }

      .option-row {
        min-height: 56px;
      }

      .panel-divider {
        margin: 12px 0;
      }

      .drag-symbol {
        height: 40px;
        margin-bottom: 8px;
      }
    }
  </style>
</head>

        <span id="panelRightPole" class="pole-half south">S</span>

  <script>
    (() => {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";

      const geometry = {
        coilAxisStart: 230,
        coilAxisLength: 160,
        coilCenterY: 270,
        coilRadiusX: 48,
        coilRadiusY: 150,
        magnetY: 270,
        magnetWidth: 187.2,
        magnetMinX: 292,
        magnetMaxX: 840,
        magnetInitialX: 620,
        referenceCoilX: 325
      };

      const state = {
        magnetX: geometry.magnetInitialX,
        facingPole: "N",
        velocity: 0,
        currentMagnitude: 0,
        inducedFieldSign: 0,
        dragging: false,
        dragOffsetX: 0,
        lastMoveX: geometry.magnetInitialX,
        lastMoveTime: performance.now(),
        lastMotionTime: 0,
        showFlux: false,
        showCurrent: false,
        showInduced: false
      };

      const elements = {
        svg: document.getElementById("simulation"),
        fluxLayer: document.getElementById("fluxLayer"),
        coilBack: document.getElementById("coilBack"),
        coilFront: document.getElementById("coilFront"),
        magnet: document.getElementById("magnet"),
        leftPoleFill: document.getElementById("leftPoleFill"),
        rightPoleFill: document.getElementById("rightPoleFill"),
        leftPoleText: document.getElementById("leftPoleText"),
        rightPoleText: document.getElementById("rightPoleText"),
        currentArrowLayer: document.getElementById("currentArrowLayer"),
        inducedFieldLayer: document.getElementById("inducedFieldLayer"),
        inducedFieldArrow: document.getElementById("inducedFieldArrow"),
        needle: document.getElementById("needle"),
        showFlux: document.getElementById("showFlux"),
        showCurrent: document.getElementById("showCurrent"),
        showInduced: document.getElementById("showInduced"),
        flipPole: document.getElementById("flipPole"),
        panelLeftPole: document.getElementById("panelLeftPole"),
        panelRightPole: document.getElementById("panelRightPole"),
        resetButton: document.getElementById("resetButton")
      };

      const coilArrowProgress = [0.305, 0.405, 0.805, 0.905];
      function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
      }

      function svgElement(name, attributes = {}) {
        const node = document.createElementNS(SVG_NS, name);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, String(value)));
        return node;
      }

      function pointOnCoil(progress) {
        const angle = Math.PI / 2 + Math.PI * 4 * progress;
        return {
          x: geometry.coilAxisStart + geometry.coilAxisLength * progress + geometry.coilRadiusX * Math.cos(angle),
          y: geometry.coilCenterY + geometry.coilRadiusY * Math.sin(angle),
          depth: Math.cos(angle)
        };
      }

      function makePath(points) {
        return points.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(" ");
      }

      function addCopperSegment(parent, points) {
        const pathData = makePath(points);
        parent.append(
          svgElement("path", { d: pathData, class: "wire-segment", stroke: "#54200d", "stroke-width": 22 }),
          svgElement("path", { d: pathData, class: "wire-segment", stroke: "url(#copperStroke)", "stroke-width": 15 }),
          svgElement("path", { d: pathData, class: "wire-segment", stroke: "#ffd4a0", "stroke-width": 3.2, opacity: 0.5 })
        );
      }

      function buildCoil() {
        const backSegments = [];
        const frontSegments = [];
        let active = [];
        let activeSide = null;
        const steps = 280;

        for (let index = 0; index <= steps; index += 1) {
          const point = pointOnCoil(index / steps);
          const side = point.depth >= 0 ? "front" : "back";
          if (activeSide === null) {
            activeSide = side;
            active = [point];
          } else if (side === activeSide) {
            active.push(point);
          } else {
            if (active.length > 1) (activeSide === "front" ? frontSegments : backSegments).push(active);
            active = [active[active.length - 1], point];
            activeSide = side;
          }
        }

        if (active.length > 1) (activeSide === "front" ? frontSegments : backSegments).push(active);
        backSegments.forEach((segment) => addCopperSegment(elements.coilBack, segment));
        frontSegments.forEach((segment) => addCopperSegment(elements.coilFront, segment));
      }

      function arrowAngleAt(progress, direction) {
        const epsilon = 0.001;
        const before = pointOnCoil(clamp(progress - epsilon, 0, 1));
        const after = pointOnCoil(clamp(progress + epsilon, 0, 1));
        const dx = (after.x - before.x) * direction;
        const dy = (after.y - before.y) * direction;
        return Math.atan2(dy, dx) * 180 / Math.PI;
      }

      function createCurrentArrow(x, y, angle) {
        const group = svgElement("g", { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${angle.toFixed(1)})` });
        group.append(svgElement("path", {
          d: "M -16 -6 L 3 -6 L 3 -11 L 17 0 L 3 11 L 3 6 L -16 6 Z",
          class: "current-arrow"
        }));
        return group;
      }

      function updateCurrentArrows() {
        elements.currentArrowLayer.replaceChildren();
        if (!state.showCurrent || state.currentMagnitude <= 0.015) return;

        const coilDirection = state.inducedFieldSign > 0 ? -1 : 1;
        coilArrowProgress.forEach((progress) => {
          const point = pointOnCoil(progress);
          elements.currentArrowLayer.append(createCurrentArrow(point.x, point.y, arrowAngleAt(progress, coilDirection)));
        });

        const leftLeadDirection = state.inducedFieldSign > 0 ? 1 : -1;
        const rightLeadDirection = -leftLeadDirection;
        elements.currentArrowLayer.append(
          createCurrentArrow(221, 451, leftLeadDirection > 0 ? 105 : -75),
          createCurrentArrow(399, 451, rightLeadDirection > 0 ? 75 : 255)
        );
      }

      function updateFluxLayer() {
        elements.fluxLayer.setAttribute("transform", `translate(${state.magnetX} ${geometry.magnetY})`);
        elements.fluxLayer.style.opacity = state.showFlux ? "1" : "0";
        const marker = state.facingPole === "N" ? "url(#fluxArrowForward)" : "url(#fluxArrowBackward)";
        elements.fluxLayer.querySelectorAll("[data-flux-arrow]").forEach((arrow) => arrow.setAttribute("marker-end", marker));
      }

      function updateMagnet() {
        elements.magnet.setAttribute("transform", `translate(${state.magnetX} ${geometry.magnetY})`);
        const positionPercent = Math.round((state.magnetX - geometry.magnetMinX) / (geometry.magnetMaxX - geometry.magnetMinX) * 100);
        elements.magnet.setAttribute("aria-valuenow", String(positionPercent));
      }

      function updatePoleDisplay() {
        const northFacesCoil = state.facingPole === "N";
        elements.leftPoleFill.setAttribute("fill", northFacesCoil ? "url(#redMagnet)" : "url(#blueMagnet)");
        elements.rightPoleFill.setAttribute("fill", northFacesCoil ? "url(#blueMagnet)" : "url(#redMagnet)");
        elements.leftPoleText.textContent = northFacesCoil ? "N" : "S";
        elements.rightPoleText.textContent = northFacesCoil ? "S" : "N";
        elements.panelLeftPole.textContent = northFacesCoil ? "N" : "S";
        elements.panelRightPole.textContent = northFacesCoil ? "S" : "N";
        elements.panelLeftPole.className = `pole-half ${northFacesCoil ? "north" : "south"}`;
        elements.panelRightPole.className = `pole-half ${northFacesCoil ? "south" : "north"}`;
        elements.flipPole.setAttribute("aria-label", `棒磁石の極を反転する。現在は${state.facingPole}極がコイル側`);
      }

      function calculateInduction() {
        if (Math.abs(state.velocity) < 5) {
          state.currentMagnitude = 0;
          state.inducedFieldSign = 0;
          return;
        }

        const facingPoleCenter = state.magnetX + 18;
        const distance = Math.abs(facingPoleCenter - geometry.referenceCoilX);
        const speedFactor = clamp(Math.abs(state.velocity) / 780, 0, 1);
        const distanceFactor = 0.12 + 0.88 / (1 + Math.pow(distance / 150, 2.35));
        const sourceFieldSign = state.facingPole === "N" ? -1 : 1;

        state.currentMagnitude = clamp(speedFactor * distanceFactor, 0, 1);
        state.inducedFieldSign = sourceFieldSign * Math.sign(state.velocity);
      }

      function updateInducedField() {
        const visible = state.showInduced && state.inducedFieldSign !== 0;
        elements.inducedFieldLayer.style.opacity = visible ? "1" : "0";
        if (!visible) return;

        const angle = state.inducedFieldSign > 0 ? 0 : 180;
        elements.inducedFieldArrow.setAttribute("transform", `translate(310 270) rotate(${angle})`);
      }

      function updateMeter() {
        const meterSign = -state.inducedFieldSign;
        const angle = state.currentMagnitude > 0.015 ? meterSign * state.currentMagnitude * 52 : 0;
        elements.needle.setAttribute("transform", `rotate(${angle.toFixed(2)} 390 610)`);
      }

      function render() {
        updateMagnet();
        updateFluxLayer();
        updateCurrentArrows();
        updateInducedField();
        updateMeter();
      }

      function eventPoint(event) {
        const point = elements.svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        return point.matrixTransform(elements.svg.getScreenCTM().inverse());
      }

      function setMagnetPosition(nextX, timestamp) {
        const clampedX = clamp(nextX, geometry.magnetMinX, geometry.magnetMaxX);
        const elapsedSeconds = Math.max((timestamp - state.lastMoveTime) / 1000, 1 / 120);
        const measuredVelocity = (clampedX - state.lastMoveX) / elapsedSeconds;
        state.velocity = state.velocity * 0.24 + measuredVelocity * 0.76;
        state.magnetX = clampedX;
        state.lastMoveX = clampedX;
        state.lastMoveTime = timestamp;
        state.lastMotionTime = timestamp;
        calculateInduction();
        render();
      }

      function stopMotion() {
        state.velocity = 0;
        state.currentMagnitude = 0;
        state.inducedFieldSign = 0;
        render();
      }

      elements.magnet.addEventListener("pointerdown", (event) => {
        const point = eventPoint(event);
        state.dragging = true;
        state.dragOffsetX = point.x - state.magnetX;
        state.lastMoveX = state.magnetX;
        state.lastMoveTime = event.timeStamp;
        state.velocity = 0;
        elements.magnet.classList.add("dragging");
        elements.magnet.setPointerCapture(event.pointerId);
      });

      elements.magnet.addEventListener("pointermove", (event) => {
        if (!state.dragging) return;
        const point = eventPoint(event);
        setMagnetPosition(point.x - state.dragOffsetX, event.timeStamp);
      });

      function endDrag(event) {
        if (!state.dragging) return;
        state.dragging = false;
        elements.magnet.classList.remove("dragging");
        if (elements.magnet.hasPointerCapture(event.pointerId)) elements.magnet.releasePointerCapture(event.pointerId);
        stopMotion();
      }

      elements.magnet.addEventListener("pointerup", endDrag);
      elements.magnet.addEventListener("pointercancel", endDrag);

      elements.magnet.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        const direction = event.key === "ArrowLeft" ? -1 : 1;
        const timestamp = performance.now();
        setMagnetPosition(state.magnetX + direction * 12, timestamp);
        window.clearTimeout(elements.magnet.keyboardStopTimer);
        elements.magnet.keyboardStopTimer = window.setTimeout(stopMotion, 90);
      });

      elements.flipPole.addEventListener("click", () => {
        state.facingPole = state.facingPole === "N" ? "S" : "N";
        updatePoleDisplay();
        calculateInduction();
        render();
      });

      elements.showFlux.addEventListener("change", () => {
        state.showFlux = elements.showFlux.checked;
        render();
      });

      elements.showCurrent.addEventListener("change", () => {
        state.showCurrent = elements.showCurrent.checked;
        render();
      });

      elements.showInduced.addEventListener("change", () => {
        state.showInduced = elements.showInduced.checked;
        render();
      });

      elements.resetButton.addEventListener("click", () => {
        state.magnetX = geometry.magnetInitialX;
        state.facingPole = "N";
        state.velocity = 0;
        state.currentMagnitude = 0;
        state.inducedFieldSign = 0;
        state.dragging = false;
        state.lastMoveX = geometry.magnetInitialX;
        state.lastMoveTime = performance.now();
        state.showFlux = false;
        state.showCurrent = false;
        state.showInduced = false;
        elements.showFlux.checked = false;
        elements.showCurrent.checked = false;
        elements.showInduced.checked = false;
        elements.magnet.classList.remove("dragging");
        updatePoleDisplay();
        render();
      });

      function animationLoop(timestamp) {
        if (state.dragging && timestamp - state.lastMotionTime > 65 && state.currentMagnitude !== 0) stopMotion();
        requestAnimationFrame(animationLoop);
      }

      buildCoil();
      updatePoleDisplay();
      render();
      requestAnimationFrame(animationLoop);
    })();
  </script>
</body>
</html>
