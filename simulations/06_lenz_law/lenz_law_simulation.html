<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>レンツの法則シミュレーション</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #5f6c7b;
      --line: #c8d2dc;
      --paper: #f7fafc;
      --panel: #ffffff;
      --coil: #78634f;
      --wire: #4b5563;
      --field: #2563eb;
      --current: #0f9f6e;
      --north: #d43f3a;
      --south: #2764c9;
      --accent: #2267a8;
      --shadow: 0 14px 34px rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #eef3f7;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 22px 0 26px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.2;
      font-weight: 780;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(680px, 1fr) 320px;
      gap: 18px;
      align-items: stretch;
    }

    .stage-wrap,
    .panel {
      background: var(--panel);
      border: 1px solid #d9e2ea;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage-wrap {
      overflow: hidden;
      min-height: 580px;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 580px;
      touch-action: none;
      user-select: none;
    }

    .panel {
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .control-group {
      padding: 14px 0;
      border-top: 1px solid #e4ebf1;
    }

    .control-group:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: #edf3f8;
      border: 1px solid #d7e1ea;
      border-radius: 8px;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 6px;
      background: #f7fafc;
      color: var(--ink);
      font: inherit;
      font-weight: 720;
      cursor: pointer;
    }

    .segmented button {
      height: 42px;
    }

    .segmented button.active {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 1px 5px rgba(34, 103, 168, 0.22);
    }

    .checks {
      display: grid;
      gap: 10px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      font-weight: 650;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .reset {
      width: 100%;
      height: 42px;
      border-color: #b8c7d5;
      background: #fff;
    }

    .reset:hover,
    .segmented button:hover {
      border-color: #91a9bd;
    }

    .magnet {
      cursor: grab;
    }

    .magnet.dragging {
      cursor: grabbing;
    }

    .small-label {
      font-size: 15px;
      font-weight: 760;
      fill: var(--muted);
    }

    .tiny-label {
      font-size: 12px;
      font-weight: 700;
      fill: var(--muted);
    }

    .meter-label {
      font-size: 18px;
      font-weight: 760;
      fill: var(--ink);
    }

    .pole-label {
      font-size: 40px;
      font-weight: 850;
      fill: #fff;
      paint-order: stroke;
      stroke: rgba(0, 0, 0, 0.12);
      stroke-width: 2px;
    }

    .fade {
      transition: opacity 120ms ease;
    }

    @media (max-width: 980px) {
      .app {
        width: min(100vw - 20px, 820px);
        padding-top: 14px;
      }

      header {
        display: block;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .stage-wrap,
      svg {
        min-height: 500px;
      }

      .panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 18px;
      }

      .panel h2,
    }

    @media (max-width: 620px) {
      .panel {
        display: block;
      }

      .stage-wrap,
      svg {
        min-height: 430px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>レンツの法則シミュレーション</h1>
        <p class="subtitle">磁石をドラッグして、誘導電流とコイル内磁場の向きを観察します。</p>
      </div>
    </header>

    <div class="layout">
      <section class="stage-wrap" aria-label="シミュレーション表示">
        <svg id="stage" viewBox="0 0 980 620" role="img" aria-labelledby="svgTitle">
          <title id="svgTitle">棒磁石、コイル、検流計を使ったレンツの法則シミュレーション</title>

          <defs>
            <linearGradient id="paperGradient" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#fbfdff"/>
              <stop offset="100%" stop-color="#eef5f9"/>
            </linearGradient>
            <linearGradient id="coilGradient" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#b99b7f"/>
              <stop offset="48%" stop-color="#6f5745"/>
              <stop offset="100%" stop-color="#c8aa8e"/>
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1f2933" flood-opacity="0.18"/>
            </filter>
            <marker id="currentArrowHead" viewBox="0 0 12 12" markerWidth="36" markerHeight="36" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M 1 2 L 10 6 L 1 10 z" fill="#0f9f6e"/>
            </marker>
            <marker id="fieldArrowHead" viewBox="0 0 13 13" markerWidth="39" markerHeight="39" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M 1 2 L 11 6.5 L 1 11 z" fill="#2563eb"/>
            </marker>
            <marker id="fluxArrowHead" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#5aaedc"/>
            </marker>
          </defs>

          <rect width="980" height="620" fill="url(#paperGradient)"/>
          <g opacity="0.58">
            <path d="M 72 438 H 895" stroke="#d4e1eb" stroke-width="2"/>
            <path d="M 75 441 H 895" stroke="#fff" stroke-width="2"/>
          </g>

          <g id="magneticLines" class="fade" opacity="0"></g>

          <g id="wireCircuit">
            <path d="M 325 334 C 220 365, 205 455, 325 480" fill="none" stroke="var(--wire)" stroke-width="8" stroke-linecap="round"/>
            <path d="M 430 334 C 515 365, 525 454, 405 480" fill="none" stroke="var(--wire)" stroke-width="8" stroke-linecap="round"/>
            <path d="M 325 480 H 406" fill="none" stroke="var(--wire)" stroke-width="8" stroke-linecap="round"/>
          </g>

          <g id="coilBack" filter="url(#softShadow)">
            <path id="coilWireBack" d="" fill="none" stroke="#403026" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>
            <g id="coilBackSegments"></g>
          </g>

          <g id="coilField" class="fade" opacity="0">
            <line id="fieldArrow" x1="0" y1="270" x2="0" y2="270" stroke="var(--field)" stroke-width="7" stroke-linecap="round" marker-end="url(#fieldArrowHead)"/>
          </g>

          <g id="magnet" class="magnet" aria-label="ドラッグできる棒磁石">
            <rect id="magnetBack" x="0" y="0" width="176" height="78" rx="7" fill="#d8e0e8" filter="url(#softShadow)"/>
            <rect id="leftPole" x="0" y="0" width="88" height="78" rx="7" fill="var(--north)"/>
            <rect id="rightPole" x="88" y="0" width="88" height="78" rx="7" fill="var(--south)"/>
            <line x1="88" y1="9" x2="88" y2="69" stroke="#fff" stroke-width="3" opacity="0.76"/>
            <text id="leftPoleText" x="44" y="52" text-anchor="middle" class="pole-label">N</text>
            <text id="rightPoleText" x="132" y="52" text-anchor="middle" class="pole-label">S</text>
            <path d="M 16 13 H 160" stroke="#fff" stroke-width="3" opacity="0.25"/>
          </g>

          <g id="coilFront" filter="url(#softShadow)">
            <g id="coilFrontSegments"></g>
          </g>

          <g id="coilCurrent" class="fade" opacity="0">
            <path id="currentPathA" d="" fill="none" stroke="var(--current)" stroke-width="5" stroke-linecap="round" marker-end="url(#currentArrowHead)"/>
            <path id="currentPathB" d="" fill="none" stroke="var(--current)" stroke-width="5" stroke-linecap="round" marker-end="url(#currentArrowHead)"/>
          </g>

          <g id="meter" transform="translate(365 488)">
            <path d="M -105 0 A 105 105 0 0 1 105 0 L 82 0 A 82 82 0 0 0 -82 0 Z" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
            <line x1="-82" y1="0" x2="-72" y2="-21" stroke="#8594a6" stroke-width="3"/>
            <line x1="-41" y1="0" x2="-37" y2="-13" stroke="#a3afbc" stroke-width="2"/>
            <line x1="0" y1="0" x2="0" y2="-28" stroke="#617284" stroke-width="3"/>
            <line x1="41" y1="0" x2="37" y2="-13" stroke="#a3afbc" stroke-width="2"/>
            <line x1="82" y1="0" x2="72" y2="-21" stroke="#8594a6" stroke-width="3"/>
            <text x="-6" y="-35" class="tiny-label">0</text>
            <text x="-88" y="-28" class="tiny-label">−</text>
            <text x="82" y="-28" class="tiny-label">＋</text>
            <line id="needle" x1="0" y1="0" x2="0" y2="-80" stroke="#d64b3f" stroke-width="5" stroke-linecap="round"/>
            <circle cx="0" cy="0" r="10" fill="#495665"/>
            <text x="-36" y="34" class="meter-label">検流計</text>
          </g>

          <text x="298" y="98" class="small-label">コイル</text>
          <text x="668" y="186" class="tiny-label">棒磁石を左右にドラッグ</text>
          <line id="dragRange" x1="0" y1="170" x2="0" y2="170" stroke="#abc0d2" stroke-width="5" stroke-linecap="round" opacity="0"/>
          <circle id="rangeMin" cx="0" cy="170" r="5" fill="#8fa7bb" opacity="0"/>
          <circle id="rangeMax" cx="0" cy="170" r="5" fill="#8fa7bb" opacity="0"/>
        </svg>
      </section>

      <aside class="panel" aria-label="操作パネル">
        <h2>操作</h2>

        <div class="control-group">
          <span class="label">コイル側に向ける極</span>
          <div class="segmented" role="group" aria-label="磁石の向き">
            <button id="poleN" type="button" class="active">N極</button>
            <button id="poleS" type="button">S極</button>
          </div>
        </div>

        <div class="control-group">
          <span class="label">表示</span>
          <div class="checks">
            <label class="check"><input id="showCurrent" type="checkbox" checked>電流方向</label>
            <label class="check"><input id="showField" type="checkbox" checked>コイル内磁場</label>
            <label class="check"><input id="showLines" type="checkbox">磁力線</label>
          </div>
        </div>

        <div class="control-group">
          <button id="reset" type="button" class="reset">リセット</button>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";

    const config = {
      coilCenterX: 360,
      coilRightX: 438,
      coilCenterY: 270,
      magnetY: 230,
      magnetWidth: 176,
      magnetHeight: 78,
      minMagnetX: 350,
      maxMagnetX: 780,
      initialMagnetX: 690,
      maxSpeed: 780,
      currentThreshold: 7,
      maxNeedleAngle: 52
    };

    const state = {
      magnetX: config.initialMagnetX,
      previousMagnetX: config.initialMagnetX,
      previousTime: performance.now(),
      velocity: 0,
      current: 0,
      inducedFieldSign: 0,
      facingPole: "N",
      dragging: false,
      dragOffsetX: 0,
      showCurrent: true,
      showField: true,
      showLines: false
    };

    const els = {
      stage: document.getElementById("stage"),
      magnet: document.getElementById("magnet"),
      leftPole: document.getElementById("leftPole"),
      rightPole: document.getElementById("rightPole"),
      leftPoleText: document.getElementById("leftPoleText"),
      rightPoleText: document.getElementById("rightPoleText"),
      magneticLines: document.getElementById("magneticLines"),
      coilWireBack: document.getElementById("coilWireBack"),
      coilBackSegments: document.getElementById("coilBackSegments"),
      coilFrontSegments: document.getElementById("coilFrontSegments"),
      coilCurrent: document.getElementById("coilCurrent"),
      currentPathA: document.getElementById("currentPathA"),
      currentPathB: document.getElementById("currentPathB"),
      coilField: document.getElementById("coilField"),
      fieldArrow: document.getElementById("fieldArrow"),
      needle: document.getElementById("needle"),
      dragRange: document.getElementById("dragRange"),
      rangeMin: document.getElementById("rangeMin"),
      rangeMax: document.getElementById("rangeMax"),
      poleN: document.getElementById("poleN"),
      poleS: document.getElementById("poleS"),
      showCurrent: document.getElementById("showCurrent"),
      showField: document.getElementById("showField"),
      showLines: document.getElementById("showLines"),
      reset: document.getElementById("reset")
    };

    const magneticFieldLines = [];
    let coilGeometry = null;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function svgPointFromEvent(event) {
      const point = els.stage.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      return point.matrixTransform(els.stage.getScreenCTM().inverse());
    }

    function pointsToPath(points) {
      return points.map((point, index) => {
        const command = index === 0 ? "M" : "L";
        return `${command} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`;
      }).join(" ");
    }

    function reversePoints(points) {
      return [...points].reverse();
    }

    function cubicPoint(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      return {
        x: uu * u * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + tt * t * p3.x,
        y: uu * u * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + tt * t * p3.y
      };
    }

    function cubicTangent(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const x = 3 * u * u * (p1.x - p0.x) + 6 * u * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x);
      const y = 3 * u * u * (p1.y - p0.y) + 6 * u * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y);
      const length = Math.hypot(x, y) || 1;
      return { x: x / length, y: y / length };
    }

    function buildCoilGeometry() {
      const leadIn = { x: 325, y: 334 };
      const leadOut = { x: 430, y: 334 };
      const startAngle = 2.36;
      const totalAngle = Math.PI * 4;
      const steps = 160;
      const centerX = 346;
      const centerY = 258;
      const radiusX = 30;
      const radiusY = 90;
      const pitch = 96;
      const coilPoints = [];
      const backSegments = [];
      const frontSegments = [];
      let activeSegment = [];
      let activeSide = null;

      function pushActiveSegment() {
        if (activeSegment.length > 1) {
          if (activeSide === "front") {
            frontSegments.push(activeSegment);
          } else {
            backSegments.push(activeSegment);
          }
        }
        activeSegment = [];
      }

      for (let i = 0; i <= steps; i += 1) {
        const progress = i / steps;
        const t = startAngle + totalAngle * progress;
        const point = {
          x: centerX + pitch * progress + radiusX * Math.cos(t),
          y: centerY + radiusY * Math.sin(t)
        };
        coilPoints.push(point);

        const side = Math.cos(t) < -0.1 ? "front" : "back";
        if (activeSide === null) {
          activeSide = side;
          activeSegment = [point];
        } else if (side === activeSide) {
          activeSegment.push(point);
        } else {
          pushActiveSegment();
          activeSide = side;
          activeSegment = [coilPoints[i - 1], point];
        }
      }

      pushActiveSegment();

      frontSegments.unshift([leadIn, coilPoints[0]]);
      frontSegments.push([coilPoints[coilPoints.length - 1], leadOut]);

      return {
        fullPath: pointsToPath([leadIn, ...coilPoints, leadOut]),
        backSegments,
        frontSegments
      };
    }

    function appendWireSegment(parent, segment, options) {
      const outline = document.createElementNS(SVG_NS, "path");
      outline.setAttribute("d", pointsToPath(segment));
      outline.setAttribute("fill", "none");
      outline.setAttribute("stroke", options.outline);
      outline.setAttribute("stroke-width", "18");
      outline.setAttribute("stroke-linecap", "round");
      outline.setAttribute("stroke-linejoin", "round");

      const copper = document.createElementNS(SVG_NS, "path");
      copper.setAttribute("d", pointsToPath(segment));
      copper.setAttribute("fill", "none");
      copper.setAttribute("stroke", options.copper);
      copper.setAttribute("stroke-width", "12");
      copper.setAttribute("stroke-linecap", "round");
      copper.setAttribute("stroke-linejoin", "round");

      const highlight = document.createElementNS(SVG_NS, "path");
      highlight.setAttribute("d", pointsToPath(segment));
      highlight.setAttribute("fill", "none");
      highlight.setAttribute("stroke", options.highlight);
      highlight.setAttribute("stroke-width", options.highlightWidth);
      highlight.setAttribute("stroke-linecap", "round");
      highlight.setAttribute("stroke-linejoin", "round");
      highlight.setAttribute("opacity", options.highlightOpacity);

      parent.append(outline, copper, highlight);
    }

    function initializeCoilDrawing() {
      coilGeometry = buildCoilGeometry();
      els.coilWireBack.setAttribute("d", coilGeometry.fullPath);
      els.coilBackSegments.replaceChildren();
      els.coilFrontSegments.replaceChildren();

      coilGeometry.backSegments.forEach((segment) => {
        appendWireSegment(els.coilBackSegments, segment, {
          outline: "#38291f",
          copper: "#6b4724",
          highlight: "#9d7040",
          highlightWidth: "4",
          highlightOpacity: "0.45"
        });
      });

      coilGeometry.frontSegments.forEach((segment) => {
        appendWireSegment(els.coilFrontSegments, segment, {
          outline: "#5a3b21",
          copper: "#b47634",
          highlight: "#e3b56e",
          highlightWidth: "5",
          highlightOpacity: "0.86"
        });
      });
    }

    function initializeMagneticFieldLines() {
      const templates = [
        { rank: 0, offset: 0, curve: 0 },
        { rank: 1, offset: -1, curve: -10 },
        { rank: 1, offset: 1, curve: 10 },
        { rank: 2, offset: -2, curve: -18 },
        { rank: 2, offset: 2, curve: 18 },
        { rank: 3, offset: -3, curve: -26 },
        { rank: 3, offset: 3, curve: 26 }
      ];

      els.magneticLines.replaceChildren();
      magneticFieldLines.length = 0;

      templates.forEach((template) => {
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#8cc8e8");
        path.setAttribute("stroke-width", "2");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");

        const arrow = document.createElementNS(SVG_NS, "line");
        arrow.setAttribute("stroke", "#5aaedc");
        arrow.setAttribute("stroke-width", "2");
        arrow.setAttribute("stroke-linecap", "round");
        arrow.setAttribute("marker-end", "url(#fluxArrowHead)");

        els.magneticLines.append(path, arrow);
        magneticFieldLines.push({ template, path, arrow });
      });
    }

    function setPole(pole) {
      state.facingPole = pole;
      els.poleN.classList.toggle("active", pole === "N");
      els.poleS.classList.toggle("active", pole === "S");

      if (pole === "N") {
        els.leftPole.setAttribute("fill", "var(--north)");
        els.rightPole.setAttribute("fill", "var(--south)");
        els.leftPoleText.textContent = "N";
        els.rightPoleText.textContent = "S";
      } else {
        els.leftPole.setAttribute("fill", "var(--south)");
        els.rightPole.setAttribute("fill", "var(--north)");
        els.leftPoleText.textContent = "S";
        els.rightPoleText.textContent = "N";
      }
    }

    function resetSimulation() {
      state.magnetX = config.initialMagnetX;
      state.previousMagnetX = config.initialMagnetX;
      state.previousTime = performance.now();
      state.velocity = 0;
      state.current = 0;
      state.inducedFieldSign = 0;
      setPole("N");
      els.showCurrent.checked = true;
      els.showField.checked = true;
      els.showLines.checked = false;
      state.showCurrent = true;
      state.showField = true;
      state.showLines = false;
      render();
    }

    function calculateInduction(now) {
      const elapsed = Math.max(16, now - state.previousTime);
      const measuredVelocity = (state.magnetX - state.previousMagnetX) / elapsed * 1000;
      state.velocity = measuredVelocity;
      state.previousMagnetX = state.magnetX;
      state.previousTime = now;

      if (Math.abs(state.velocity) < config.currentThreshold) {
        state.current = 0;
        state.inducedFieldSign = 0;
        return;
      }

      const poleDistance = Math.abs(state.magnetX - config.coilCenterX);
      const distanceFactor = 0.1 + 0.9 / (1 + Math.pow(poleDistance / 135, 2.25));
      const speedFactor = clamp(Math.abs(state.velocity) / config.maxSpeed, 0, 1);

      const fluxSign = state.facingPole === "N" ? -1 : 1;
      const fluxChangeSign = fluxSign * Math.sign(-state.velocity);
      state.inducedFieldSign = -fluxChangeSign;
      state.current = state.inducedFieldSign * speedFactor * distanceFactor;
    }

    function setPathDirection(clockwise) {
      if (!coilGeometry) return;

      const visibleSegments = coilGeometry.frontSegments
        .filter((segment) => segment.length > 8)
        .sort((a, b) => b.length - a.length)
        .slice(0, 2);
      const first = visibleSegments[0] || [];
      const second = visibleSegments[1] || first;
      const pathA = clockwise ? reversePoints(first) : first;
      const pathB = clockwise ? reversePoints(second) : second;

      els.currentPathA.setAttribute("d", pointsToPath(pathA));
      els.currentPathB.setAttribute("d", pointsToPath(pathB));
    }

    function renderMagnet() {
      els.magnet.setAttribute("transform", `translate(${state.magnetX} ${config.magnetY})`);
      els.dragRange.setAttribute("x1", config.minMagnetX);
      els.dragRange.setAttribute("x2", config.maxMagnetX + config.magnetWidth);
      els.rangeMin.setAttribute("cx", config.minMagnetX);
      els.rangeMax.setAttribute("cx", config.maxMagnetX + config.magnetWidth);
    }

    function renderMagneticLines() {
      els.magneticLines.style.opacity = state.showLines ? "1" : "0";
      if (!state.showLines) return;

      const leftEdge = { x: state.magnetX + 2, y: config.magnetY + config.magnetHeight / 2 };
      const rightEdge = { x: state.magnetX + config.magnetWidth - 2, y: config.magnetY + config.magnetHeight / 2 };
      const northPole = state.facingPole === "N" ? leftEdge : rightEdge;
      const southPole = state.facingPole === "N" ? rightEdge : leftEdge;
      const direction = Math.sign(southPole.x - northPole.x) || 1;
      const poleDistance = Math.abs(state.magnetX - config.coilCenterX);
      const density = clamp(1 - (poleDistance - 95) / 430, 0, 1);
      const visibleRank = density > 0.78 ? 3 : density > 0.52 ? 2 : density > 0.28 ? 1 : 0;
      const spacing = 26 - density * 12;
      const baseOpacity = 0.22 + density * 0.38;
      const coilExitX = config.coilCenterX - 100;

      magneticFieldLines.forEach(({ template, path, arrow }) => {
        if (template.rank > visibleRank) {
          path.setAttribute("opacity", "0");
          arrow.setAttribute("opacity", "0");
          return;
        }

        const lineOffset = template.offset * spacing;
        const start = {
          x: northPole.x - direction * 8,
          y: northPole.y + lineOffset * 0.48
        };
        const end = {
          x: coilExitX,
          y: config.coilCenterY + lineOffset
        };
        const controlA = {
          x: northPole.x - direction * 85,
          y: start.y + template.curve * 0.2
        };
        const controlB = {
          x: config.coilCenterX + 35,
          y: end.y + template.curve
        };

        const d = `M ${start.x.toFixed(1)} ${start.y.toFixed(1)} C ${controlA.x.toFixed(1)} ${controlA.y.toFixed(1)}, ${controlB.x.toFixed(1)} ${controlB.y.toFixed(1)}, ${end.x.toFixed(1)} ${end.y.toFixed(1)}`;
        const arrowPoint = cubicPoint(start, controlA, controlB, end, 0.56);
        const tangent = cubicTangent(start, controlA, controlB, end, 0.56);
        const arrowLength = 16;
        const opacity = baseOpacity - template.rank * 0.03;

        path.setAttribute("d", d);
        path.setAttribute("opacity", opacity.toFixed(2));
        arrow.setAttribute("x1", arrowPoint.x - tangent.x * arrowLength * 0.5);
        arrow.setAttribute("y1", arrowPoint.y - tangent.y * arrowLength * 0.5);
        arrow.setAttribute("x2", arrowPoint.x + tangent.x * arrowLength * 0.5);
        arrow.setAttribute("y2", arrowPoint.y + tangent.y * arrowLength * 0.5);
        arrow.setAttribute("opacity", clamp(opacity + 0.15, 0, 0.72).toFixed(2));
      });
    }

    function renderCurrentAndField() {
      const active = Math.abs(state.current) > 0.02;
      const bRight = state.inducedFieldSign > 0;
      const clockwise = !bRight;

      els.coilCurrent.style.opacity = state.showCurrent && active ? "1" : "0";
      els.coilField.style.opacity = state.showField && active ? "1" : "0";

      if (active) {
        setPathDirection(clockwise);

        const startX = bRight ? 312 : 408;
        const endX = bRight ? 408 : 312;
        els.fieldArrow.setAttribute("x1", startX);
        els.fieldArrow.setAttribute("x2", endX);
        els.fieldArrow.setAttribute("y1", config.coilCenterY);
        els.fieldArrow.setAttribute("y2", config.coilCenterY);
      }
    }

    function renderMeter() {
      const angle = clamp(state.current, -1, 1) * config.maxNeedleAngle;
      els.needle.setAttribute("transform", `rotate(${angle})`);
    }

    function render() {
      renderMagnet();
      renderMagneticLines();
      renderCurrentAndField();
      renderMeter();
    }

    function tick(now) {
      calculateInduction(now);
      render();
      requestAnimationFrame(tick);
    }

    els.magnet.addEventListener("pointerdown", (event) => {
      const point = svgPointFromEvent(event);
      state.dragging = true;
      state.dragOffsetX = point.x - state.magnetX;
      state.previousMagnetX = state.magnetX;
      state.previousTime = performance.now();
      els.magnet.classList.add("dragging");
      els.magnet.setPointerCapture(event.pointerId);
    });

    els.magnet.addEventListener("pointermove", (event) => {
      if (!state.dragging) return;
      const point = svgPointFromEvent(event);
      state.magnetX = clamp(point.x - state.dragOffsetX, config.minMagnetX, config.maxMagnetX);
    });

    function endDrag(event) {
      if (!state.dragging) return;
      state.dragging = false;
      state.velocity = 0;
      state.current = 0;
      state.inducedFieldSign = 0;
      els.magnet.classList.remove("dragging");
      if (event && els.magnet.hasPointerCapture(event.pointerId)) {
        els.magnet.releasePointerCapture(event.pointerId);
      }
      render();
    }

    els.magnet.addEventListener("pointerup", endDrag);
    els.magnet.addEventListener("pointercancel", endDrag);

    els.poleN.addEventListener("click", () => setPole("N"));
    els.poleS.addEventListener("click", () => setPole("S"));

    els.showCurrent.addEventListener("change", () => {
      state.showCurrent = els.showCurrent.checked;
      render();
    });

    els.showField.addEventListener("change", () => {
      state.showField = els.showField.checked;
      render();
    });

    els.showLines.addEventListener("change", () => {
      state.showLines = els.showLines.checked;
      render();
    });

    els.reset.addEventListener("click", resetSimulation);

    initializeCoilDrawing();
    initializeMagneticFieldLines();
    if (new URLSearchParams(window.location.search).get("lines") === "1") {
      state.showLines = true;
      els.showLines.checked = true;
    }
    setPole("N");
    render();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
