<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>斜面上の物体はいつ動き出すか</title>
  <style>
    :root {
      --ink: #12213a;
      --muted: #687385;
      --line: #d9e0e8;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --board: #f6f6f3;
      --block: #d8dde4;
      --accent: #1769d1;
      --green: #138b39;
      --green-dark: #0d6e2c;
      --force: #df2020;
      --normal: #1b62c5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      padding: 16px 20px 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70px;
    }

    h1 {
      margin: 0;
      width: min(760px, 100%);
      padding: 8px 20px;
      border: 1px solid #cbd4df;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      text-align: center;
      font-size: clamp(1.8rem, 3.1vw, 2.7rem);
      line-height: 1.25;
      letter-spacing: 0;
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(620px, 1fr) minmax(300px, 390px);
      gap: 14px;
    }

    .simulation,
    .controls {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .simulation {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 18px 20px 16px;
    }

    .scene-wrap {
      min-height: 0;
      position: relative;
      border-radius: 6px;
      background: #ffffff;
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 360px;
    }

    .floor {
      stroke: #111827;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .board {
      fill: var(--board);
      stroke: #111827;
      stroke-width: 3;
    }

    .block {
      fill: var(--block);
      stroke: #111827;
      stroke-width: 3;
    }

    .angle-arc {
      fill: none;
      stroke: #111827;
      stroke-width: 3;
    }

    .theta-label {
      fill: #111827;
      font-size: 32px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .force-layer {
      opacity: 0;
      transition: opacity 0.18s ease;
      pointer-events: none;
    }

    .force-layer.visible {
      opacity: 1;
    }

    .force-main {
      stroke: var(--force);
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
    }

    .force-normal {
      stroke: var(--normal);
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
    }

    .force-guide {
      stroke: var(--force);
      stroke-width: 2;
      stroke-dasharray: 8 7;
      fill: none;
      opacity: 0.72;
      stroke-linecap: round;
    }

    .force-label {
      fill: var(--force);
      font-size: 25px;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .force-label.normal {
      fill: var(--normal);
    }

    .readouts {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 98px;
    }

    .readout {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 8px;
      padding: 6px 10px;
    }

    .readout + .readout {
      border-left: 1px solid var(--line);
    }

    .readout-label {
      font-size: 1.02rem;
      font-weight: 700;
      color: #1d2740;
    }

    .readout-value {
      font-size: clamp(1.85rem, 3vw, 2.55rem);
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      padding: 18px 20px;
      display: grid;
      align-content: start;
      gap: 14px;
      overflow: auto;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    .control-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .value-box {
      min-width: 96px;
      padding: 5px 10px;
      border: 1px solid #d3dce6;
      border-radius: 6px;
      background: #fbfcfe;
      text-align: right;
      font-size: 1.45rem;
      font-weight: 500;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .scale {
      display: flex;
      justify-content: space-between;
      color: #1f2937;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action {
      width: 100%;
      min-height: 54px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-weight: 800;
      font-size: 1.08rem;
      cursor: pointer;
    }

    .action.primary {
      color: #ffffff;
      background: linear-gradient(180deg, #22a347, var(--green));
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.14);
    }

    .action.primary:disabled {
      cursor: default;
      opacity: 0.62;
    }

    .action.secondary {
      color: #1d2737;
      background: #ffffff;
      border-color: #ccd6e0;
    }

    .action.secondary.active {
      color: #ffffff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .reset {
      min-height: 54px;
      color: #1d2737;
      background: #ffffff;
      border: 2px solid #1d2737;
    }

    .manual {
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      main {
        grid-template-columns: 1fr;
      }

      svg {
        min-height: 330px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>斜面上の物体はいつ動き出すか</h1>
    </header>

    <main>
      <section class="simulation" aria-label="斜面上の物体の表示">
        <div class="scene-wrap">
          <svg id="scene" viewBox="0 0 760 460" role="img" aria-label="横から見た板と物体">
            <defs>
              <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#df2020"></path>
              </marker>
              <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b62c5"></path>
              </marker>
            </defs>

            <line class="floor" x1="28" y1="416" x2="732" y2="416"></line>
            <path class="angle-arc" id="angleArc" d=""></path>
            <text class="theta-label" id="thetaSymbol" x="0" y="0">θ</text>

            <g id="slopeGroup">
              <rect class="board" x="0" y="-9" width="460" height="18" rx="1"></rect>
              <g id="blockGroup">
                <rect class="block" id="blockShape" x="-31" y="-59" width="62" height="50" rx="1"></rect>
              </g>
            </g>

            <g class="force-layer" id="forceLayer" aria-hidden="true">
              <line class="force-main" id="mgArrow" marker-end="url(#arrow-red)"></line>
              <line class="force-normal" id="normalArrow" marker-end="url(#arrow-blue)"></line>
              <line class="force-main" id="frictionArrow" marker-end="url(#arrow-red)"></line>
              <line class="force-guide" id="parallelGuide" marker-end="url(#arrow-red)"></line>
              <line class="force-guide" id="normalGuide" marker-end="url(#arrow-red)"></line>
              <text class="force-label" id="mgLabel">mg</text>
              <text class="force-label normal" id="normalLabel">N</text>
              <text class="force-label" id="frictionLabel">f</text>
              <text class="force-label" id="parallelLabel">mg sin θ</text>
              <text class="force-label" id="normalCompLabel">mg cos θ</text>
            </g>
          </svg>
        </div>

        <div class="readouts" aria-label="角度の表示">
          <div class="readout">
            <div class="readout-label">斜面の角度</div>
            <div class="readout-value" id="currentAngle">0.0°</div>
          </div>
          <div class="readout">
            <div class="readout-label">滑り出した角度</div>
            <div class="readout-value" id="slipAngle">--- °</div>
          </div>
        </div>
      </section>

      <aside class="controls" aria-label="操作パネル">
        <div class="control">
          <div class="control-head">
            <label for="mass">質量 m</label>
            <output class="value-box" id="massValue" for="mass">2.0 kg</output>
          </div>
          <input id="mass" type="range" min="0.5" max="5.0" step="0.1" value="2.0">
          <div class="scale"><span>0.5</span><span>5.0</span></div>
        </div>

        <div class="control">
          <div class="control-head">
            <label for="mu">静止摩擦係数 μ</label>
            <output class="value-box" id="muValue" for="mu">0.50</output>
          </div>
          <input id="mu" type="range" min="0.10" max="1.00" step="0.01" value="0.50">
          <div class="scale"><span>0.10</span><span>1.00</span></div>
        </div>

        <button class="action primary" id="tiltButton" type="button">▶ ゆっくり傾ける</button>

        <div class="control manual">
          <div class="control-head">
            <label for="angle">斜面の角度 θ</label>
            <output class="value-box" id="angleValue" for="angle">0.0°</output>
          </div>
          <input id="angle" type="range" min="0" max="60" step="0.1" value="0">
          <div class="scale"><span>0°</span><span>60°</span></div>
        </div>

        <div class="button-row">
          <button class="action secondary" id="studyButton" type="button" aria-pressed="false">力ベクトル表示</button>
          <button class="action reset" id="resetButton" type="button">⟳ リセット</button>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const state = {
      angle: 0,
      mass: 2.0,
      mu: 0.50,
      slipAngle: null,
      blockProgress: 0,
      isSliding: false,
      showForces: false,
      autoTiltFrame: null,
      slideFrame: null,
      lastTiltTime: null,
      lastSlideTime: null
    };

    const boardCorner = { x: 82, y: 416 };
    const boardHalfThickness = 9;
    const boardLength = 460;
    const blockStart = 292;
    const blockEnd = 78;

    const els = {
      slopeGroup: document.getElementById("slopeGroup"),
      blockGroup: document.getElementById("blockGroup"),
      blockShape: document.getElementById("blockShape"),
      angleArc: document.getElementById("angleArc"),
      thetaSymbol: document.getElementById("thetaSymbol"),
      forceLayer: document.getElementById("forceLayer"),
      mass: document.getElementById("mass"),
      mu: document.getElementById("mu"),
      angle: document.getElementById("angle"),
      massValue: document.getElementById("massValue"),
      muValue: document.getElementById("muValue"),
      angleValue: document.getElementById("angleValue"),
      currentAngle: document.getElementById("currentAngle"),
      slipAngle: document.getElementById("slipAngle"),
      tiltButton: document.getElementById("tiltButton"),
      studyButton: document.getElementById("studyButton"),
      resetButton: document.getElementById("resetButton"),
      mgArrow: document.getElementById("mgArrow"),
      normalArrow: document.getElementById("normalArrow"),
      frictionArrow: document.getElementById("frictionArrow"),
      parallelGuide: document.getElementById("parallelGuide"),
      normalGuide: document.getElementById("normalGuide"),
      mgLabel: document.getElementById("mgLabel"),
      normalLabel: document.getElementById("normalLabel"),
      frictionLabel: document.getElementById("frictionLabel"),
      parallelLabel: document.getElementById("parallelLabel"),
      normalCompLabel: document.getElementById("normalCompLabel")
    };

    const studyLabelShow = els.studyButton.textContent;
    const studyLabelHide = "力ベクトル非表示";

    function toRad(deg) {
      return deg * Math.PI / 180;
    }

    function roundAngle(value) {
      return Math.round(value * 10) / 10;
    }

    function boardOrigin(angleDeg) {
      const rad = toRad(angleDeg);
      return {
        x: boardCorner.x - boardHalfThickness * Math.sin(rad),
        y: boardCorner.y - boardHalfThickness * Math.cos(rad)
      };
    }

    function rotatePoint(localX, localY, angleDeg) {
      const rad = toRad(-angleDeg);
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const origin = boardOrigin(angleDeg);
      return {
        x: origin.x + localX * cos - localY * sin,
        y: origin.y + localX * sin + localY * cos
      };
    }

    function setLine(line, start, end) {
      line.setAttribute("x1", start.x);
      line.setAttribute("y1", start.y);
      line.setAttribute("x2", end.x);
      line.setAttribute("y2", end.y);
    }

    function setText(text, point) {
      text.setAttribute("x", point.x);
      text.setAttribute("y", point.y);
    }

    function blockColor(mass) {
      const ratio = (mass - 0.5) / 4.5;
      const light = [216, 221, 228];
      const dark = [92, 104, 122];
      const rgb = light.map((start, index) => Math.round(start + (dark[index] - start) * ratio));
      return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
    }

    function stopAutoTilt() {
      if (state.autoTiltFrame !== null) {
        cancelAnimationFrame(state.autoTiltFrame);
        state.autoTiltFrame = null;
      }
      state.lastTiltTime = null;
      els.tiltButton.disabled = false;
    }

    function stopSlide() {
      if (state.slideFrame !== null) {
        cancelAnimationFrame(state.slideFrame);
        state.slideFrame = null;
      }
      state.lastSlideTime = null;
    }

    function hasReachedSlip(angle = state.angle) {
      return Math.tan(toRad(angle)) > state.mu;
    }

    function beginSlide() {
      if (state.isSliding) {
        return;
      }

      state.isSliding = true;
      state.slipAngle = roundAngle(state.angle);
      state.blockProgress = 0;
      setStudyDisplay(false);
      stopAutoTilt();
      animateSlide();
    }

    function animateSlide(time) {
      if (!state.isSliding) {
        return;
      }

      if (state.lastSlideTime === null) {
        state.lastSlideTime = time || performance.now();
      }

      const now = time || performance.now();
      const delta = Math.min(48, now - state.lastSlideTime);
      state.lastSlideTime = now;
      state.blockProgress = Math.min(1, state.blockProgress + delta / 1800);

      render();

      if (state.blockProgress < 1) {
        state.slideFrame = requestAnimationFrame(animateSlide);
      } else {
        state.slideFrame = null;
        state.lastSlideTime = null;
      }
    }

    function startAutoTilt() {
      stopAutoTilt();
      stopSlide();
      state.angle = 0;
      state.slipAngle = null;
      state.blockProgress = 0;
      state.isSliding = false;
      els.angle.value = "0";
      els.tiltButton.disabled = true;
      render();
      state.autoTiltFrame = requestAnimationFrame(stepAutoTilt);
    }

    function stepAutoTilt(time) {
      if (state.lastTiltTime === null) {
        state.lastTiltTime = time;
      }

      const delta = Math.min(48, time - state.lastTiltTime);
      state.lastTiltTime = time;
      state.angle = Math.min(60, state.angle + delta * 0.004);
      state.angle = roundAngle(state.angle);
      els.angle.value = String(state.angle);

      if (hasReachedSlip()) {
        beginSlide();
        render();
        return;
      }

      render();

      if (state.angle < 60) {
        state.autoTiltFrame = requestAnimationFrame(stepAutoTilt);
      } else {
        stopAutoTilt();
      }
    }

    function manualAngleChanged() {
      stopAutoTilt();
      stopSlide();
      state.angle = Number(els.angle.value);
      state.slipAngle = null;
      state.blockProgress = 0;
      state.isSliding = false;

      if (hasReachedSlip()) {
        beginSlide();
      }

      render();
    }

    function updateForces(blockX) {
      const angle = state.angle;
      const rad = toRad(angle);
      const center = rotatePoint(blockX, -34, angle);
      const downhill = { x: -Math.cos(rad), y: Math.sin(rad) };
      const uphill = { x: Math.cos(rad), y: -Math.sin(rad) };
      const outward = { x: -Math.sin(rad), y: -Math.cos(rad) };
      const inward = { x: Math.sin(rad), y: Math.cos(rad) };
      const gravityLength = 28 * state.mass;
      const parallelLength = gravityLength * Math.sin(rad);
      const normalComponentLength = gravityLength * Math.cos(rad);

      const mgEnd = { x: center.x, y: center.y + gravityLength };
      const normalEnd = {
        x: center.x + outward.x * normalComponentLength,
        y: center.y + outward.y * normalComponentLength
      };
      const frictionEnd = {
        x: center.x + uphill.x * parallelLength,
        y: center.y + uphill.y * parallelLength
      };
      const parallelEnd = {
        x: center.x + downhill.x * parallelLength,
        y: center.y + downhill.y * parallelLength
      };
      const normalCompEnd = {
        x: center.x + inward.x * normalComponentLength,
        y: center.y + inward.y * normalComponentLength
      };

      setLine(els.mgArrow, center, mgEnd);
      setLine(els.normalArrow, center, normalEnd);
      setLine(els.frictionArrow, center, frictionEnd);
      setLine(els.parallelGuide, center, parallelEnd);
      setLine(els.normalGuide, center, normalCompEnd);

      setText(els.mgLabel, { x: mgEnd.x - 58, y: mgEnd.y + 28 });
      setText(els.normalLabel, { x: normalEnd.x - 24, y: normalEnd.y - 12 });
      setText(els.frictionLabel, { x: frictionEnd.x + 8, y: frictionEnd.y - 6 });
      setText(els.parallelLabel, { x: parallelEnd.x - 120, y: parallelEnd.y + 18 });
      setText(els.normalCompLabel, { x: normalCompEnd.x + 10, y: normalCompEnd.y + 26 });
    }

    function setStudyDisplay(show) {
      state.showForces = show && !state.isSliding;
      els.studyButton.classList.toggle("active", state.showForces);
      els.studyButton.setAttribute("aria-pressed", String(state.showForces));
      els.studyButton.textContent = state.showForces ? studyLabelHide : studyLabelShow;
    }

    function updateAngleArc(angle) {
      const r = 62;
      const end = {
        x: boardCorner.x + r * Math.cos(toRad(angle)),
        y: boardCorner.y - r * Math.sin(toRad(angle))
      };
      const largeArc = angle > 180 ? 1 : 0;
      els.angleArc.setAttribute(
        "d",
        `M ${boardCorner.x + r} ${boardCorner.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y}`
      );

      const labelLocalX = 106;
      const boardTopNearLabel = rotatePoint(labelLocalX, -boardHalfThickness, angle);
      const boardBottomNearLabel = rotatePoint(labelLocalX, boardHalfThickness, angle);
      let labelX;
      let labelY;

      if (angle < 20) {
        labelX = boardCorner.x + 96;
        labelY = boardCorner.y + 34;
      } else {
        labelX = boardBottomNearLabel.x + 14;
        labelY = Math.min(boardCorner.y - 8, boardBottomNearLabel.y + 42);
      }

      els.thetaSymbol.setAttribute("x", labelX);
      els.thetaSymbol.setAttribute("y", labelY);
    }

    function render() {
      const angle = roundAngle(state.angle);
      const blockX = blockStart + (blockEnd - blockStart) * state.blockProgress;
      const origin = boardOrigin(angle);

      els.slopeGroup.setAttribute("transform", `translate(${origin.x} ${origin.y}) rotate(${-angle})`);
      els.blockGroup.setAttribute("transform", `translate(${blockX} 0)`);
      els.blockShape.setAttribute("style", `fill: ${blockColor(state.mass)}`);
      els.currentAngle.textContent = `${angle.toFixed(1)}°`;
      els.angleValue.textContent = `${angle.toFixed(1)}°`;
      els.massValue.textContent = `${state.mass.toFixed(1)} kg`;
      els.muValue.textContent = state.mu.toFixed(2);
      els.slipAngle.textContent = state.slipAngle === null ? "--- °" : `${state.slipAngle.toFixed(1)}°`;
      els.forceLayer.classList.toggle("visible", state.showForces && !state.isSliding);

      updateAngleArc(angle);
      updateForces(blockX);
    }

    function resetAll() {
      stopAutoTilt();
      stopSlide();
      state.angle = 0;
      state.mass = 2.0;
      state.mu = 0.50;
      state.slipAngle = null;
      state.blockProgress = 0;
      state.isSliding = false;
      state.showForces = false;

      els.angle.value = "0";
      els.mass.value = "2.0";
      els.mu.value = "0.50";
      setStudyDisplay(false);
      render();
    }

    els.mass.addEventListener("input", () => {
      state.mass = Number(els.mass.value);
      render();
    });

    els.mu.addEventListener("input", () => {
      state.mu = Number(els.mu.value);
      if (!state.isSliding && hasReachedSlip()) {
        beginSlide();
      }
      render();
    });

    els.angle.addEventListener("input", manualAngleChanged);
    els.tiltButton.addEventListener("click", startAutoTilt);
    els.resetButton.addEventListener("click", resetAll);
    els.studyButton.addEventListener("click", () => {
      setStudyDisplay(!state.showForces);
      render();
    });

    render();
  </script>
</body>
</html>
