<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合成速度シミュレーション</title>
  <style>
    :root {
      --blue: #0f5eb8;
      --blue-dark: #073b85;
      --blue-soft: #e8f2ff;
      --line: #d7dee9;
      --text: #172033;
      --muted: #657386;
      --card: #ffffff;
      --shadow: 0 8px 22px rgba(16, 42, 78, .12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 1100px;
      color: var(--text);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      background: #f7f9fc;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 22px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid #d5deeb;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 12px rgba(28, 54, 93, .08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--blue-dark);
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand svg { width: 56px; height: 42px; fill: var(--blue); }

    .lesson-title {
      min-width: 0;
      flex: 1;
      padding-left: 20px;
      border-left: 1px solid var(--line);
      font-size: 18px;
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-box {
      width: 68px;
      height: 52px;
      display: grid;
      place-items: center;
      gap: 1px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--blue-dark);
      font-weight: 700;
      font-size: 12px;
    }

    .icon-box span:first-child { font-size: 24px; line-height: 1; }

    main {
      display: grid;
      grid-template-columns: minmax(680px, 1fr) 360px;
      gap: 18px;
      padding: 12px;
    }

    .left {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(15, 43, 76, .07);
    }

    .tab {
      border: 0;
      border-right: 1px solid var(--line);
      padding: 17px 14px;
      background: linear-gradient(#fff, #f8fbff);
      color: #1c2c44;
      font: inherit;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .tab:last-child { border-right: 0; }
    .tab small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, #1277da, #0a55af);
    }

    .tab.active small { color: rgba(255, 255, 255, .92); }

    .stage-wrap {
      position: relative;
      min-height: 520px;
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      border: 1px solid #cbd6e5;
      box-shadow: var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 520px;
      background: #c7ecff;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 18px;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
    }

    button {
      min-height: 38px;
      border-radius: 7px;
      border: 1px solid var(--blue);
      background: #fff;
      color: var(--blue);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button.primary {
      color: #fff;
      background: linear-gradient(135deg, #136ac6, #0d4fa7);
    }

    button:disabled {
      border-color: #d0d5dd;
      color: #9198a3;
      background: #eceff3;
      cursor: not-allowed;
    }

    .field {
      display: grid;
      grid-template-columns: 112px 1fr 74px;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
    }

    .field label {
      font-weight: 800;
      line-height: 1.25;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .value {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
    }

    .hint {
      margin-top: 6px;
      padding: 7px 9px;
      border-radius: 6px;
      color: #0e54a7;
      background: var(--blue-soft);
      font-weight: 800;
      font-size: 13px;
      line-height: 1.35;
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      white-space: nowrap;
    }

    .check input {
      width: 20px;
      height: 20px;
      accent-color: var(--blue);
    }

    .results {
      display: grid;
      gap: 6px;
    }

    .result-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #edf1f6;
      font-weight: 800;
    }

    .result-row:last-child { border-bottom: 0; }
    .result-value {
      color: var(--blue);
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }

    .formula {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      background: #f4f8ff;
      color: #17345f;
      border: 1px solid #d8e7fb;
      font-family: "Yu Gothic", Meiryo, sans-serif;
      font-size: 13px;
      line-height: 1.55;
    }

    .formula code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
    }

    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      color: #0b57aa;
      background: #dfeeff;
      font-weight: 900;
    }

    @media (max-width: 1180px) {
      body { min-width: 980px; }
      main { grid-template-columns: minmax(620px, 1fr) 330px; }
      .brand { font-size: 28px; }
      .field { grid-template-columns: 100px 1fr 68px; }
      .tab { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <svg viewBox="0 0 128 80" aria-hidden="true">
          <path d="M15 50h90c-4 13-17 20-35 20H37C25 70 17 63 15 50Z"></path>
          <path d="M44 48V28h13V14h11v14h23v20H80V37H55v11H44Z"></path>
          <path d="M7 57h111v6H7z"></path>
        </svg>
        <span>合成速度シミュレーション</span>
      </div>
      <div id="lessonTitle" class="lesson-title">課題1：正面に到達を目指そう</div>
      <div class="top-actions" aria-hidden="true">
        <div class="icon-box"><span>?</span><span>使い方</span></div>
        <div class="icon-box"><span>☰</span><span>メニュー</span></div>
      </div>
    </header>

    <main>
      <section class="left">
        <nav class="tabs" aria-label="課題モード">
          <button class="tab active" data-task="1">◎ 課題1　正面到達<small>正面のゴールに到達しよう</small></button>
          <button class="tab" data-task="2">◷ 課題2　最速到着<small>最も早く対岸に着く向きを探そう</small></button>
          <button class="tab" data-task="3">≋ 課題3　流速 ＞ 船速<small>正面到達できるか考えよう</small></button>
        </nav>

        <div class="stage-wrap">
          <canvas id="stage" width="1080" height="650"></canvas>
        </div>
      </section>

      <aside class="side">
        <section class="card">
          <h2>⚙ 操作</h2>
          <div class="controls">
            <button id="startBtn" class="primary">▶ 開始</button>
            <button id="pauseBtn" disabled>Ⅱ 一時停止</button>
            <button id="resetBtn">↻ リセット</button>
          </div>
        </section>

        <section class="card">
          <h2>⛵ ボート設定</h2>
          <div id="speedField" class="field">
            <label for="speed">ボートの速さ<br><small>水に対して</small></label>
            <input id="speed" type="range" min="1" max="10" step="0.1">
            <div class="value"><span id="speedValue"></span><small>m/s</small></div>
          </div>
          <div id="fixedSpeed" class="hint" hidden>ボートの速さは 6.0 m/s で固定です。</div>
          <div class="field">
            <label for="angle">ボートの向き</label>
            <input id="angle" type="range" min="-80" max="80" step="1">
            <div class="value"><span id="angleValue"></span><small>°</small></div>
          </div>
          <div class="hint">0° = 正面。正の向きは上流側です。</div>
        </section>

        <section id="riverCard" class="card" hidden>
          <h2>≋ 川の条件</h2>
          <div class="field">
            <label for="width">川幅</label>
            <input id="width" type="range" min="50" max="200" step="10">
            <div class="value"><span id="widthValue"></span><small>m</small></div>
          </div>
          <div class="field">
            <label for="river">川の流速</label>
            <input id="river" type="range" min="0" max="8" step="0.1">
            <div class="value"><span id="riverValue"></span><small>m/s</small></div>
          </div>
          <div id="conditionBadge" class="badge"></div>
        </section>

        <section class="card">
          <h2>◉ 表示切替</h2>
          <div class="checks">
            <label class="check"><input id="showVectors" type="checkbox">速度ベクトル</label>
            <label class="check"><input id="showFormula" type="checkbox">数式</label>
            <label class="check"><input id="showComponents" type="checkbox">成分</label>
            <label class="check"><input id="showTrail" type="checkbox">軌跡</label>
          </div>
        </section>

        <section class="card">
          <h2>▮ 結果</h2>
          <div id="results" class="results"></div>
          <div id="formulaBox" class="formula" hidden></div>
        </section>
      </aside>
    </main>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");

    const ui = {
      title: document.getElementById("lessonTitle"),
      tabs: [...document.querySelectorAll(".tab")],
      start: document.getElementById("startBtn"),
      pause: document.getElementById("pauseBtn"),
      reset: document.getElementById("resetBtn"),
      speedField: document.getElementById("speedField"),
      fixedSpeed: document.getElementById("fixedSpeed"),
      speed: document.getElementById("speed"),
      speedValue: document.getElementById("speedValue"),
      angle: document.getElementById("angle"),
      angleValue: document.getElementById("angleValue"),
      riverCard: document.getElementById("riverCard"),
      width: document.getElementById("width"),
      widthValue: document.getElementById("widthValue"),
      river: document.getElementById("river"),
      riverValue: document.getElementById("riverValue"),
      conditionBadge: document.getElementById("conditionBadge"),
      showVectors: document.getElementById("showVectors"),
      showFormula: document.getElementById("showFormula"),
      showComponents: document.getElementById("showComponents"),
      showTrail: document.getElementById("showTrail"),
      results: document.getElementById("results"),
      formula: document.getElementById("formulaBox")
    };

    const taskSettings = {
      1: {
        title: "課題1：正面に到達を目指そう",
        W: 100, river: 2, speed: 6, angle: 0,
        vectors: false, components: false, formula: false, trail: true
      },
      2: {
        title: "課題2：対岸への最速の到着を目指そう",
        W: 100, river: 2, speed: 6, angle: 0,
        vectors: false, components: false, formula: false, trail: true
      },
      3: {
        title: "課題3：流速＞船速で正面到達できるか考えよう",
        W: 100, river: 5, speed: 3, angle: 0,
        vectors: true, components: false, formula: false, trail: true
      }
    };

    const state = {
      task: 1,
      running: false,
      done: false,
      time: 0,
      bestTime: null,
      x: 0,
      y: 0,
      trail: [],
      lastFrame: 0,
      result: null,
      W: 100,
      river: 2,
      speed: 6,
      angle: 0,
      showVectors: false,
      showComponents: false,
      showFormula: false,
      showTrail: true
    };

    function resetTask(task = state.task) {
      const s = taskSettings[task];
      state.task = task;
      state.running = false;
      state.done = false;
      state.time = 0;
      state.x = 0;
      state.y = 0;
      state.trail = [{ x: 0, y: 0 }];
      state.result = null;
      state.W = s.W;
      state.river = s.river;
      state.speed = s.speed;
      state.angle = s.angle;
      state.showVectors = s.vectors;
      state.showComponents = s.components;
      state.showFormula = s.formula;
      state.showTrail = s.trail;
      state.bestTime = null;
      syncUI();
      draw();
    }

    function setTask(task) {
      resetTask(task);
    }

    function syncUI() {
      ui.title.textContent = taskSettings[state.task].title;
      ui.tabs.forEach(tab => tab.classList.toggle("active", Number(tab.dataset.task) === state.task));

      ui.speedField.hidden = state.task === 2;
      ui.fixedSpeed.hidden = state.task !== 2;
      ui.riverCard.hidden = state.task !== 3;

      ui.speed.value = state.speed;
      ui.angle.value = state.angle;
      ui.width.value = state.W;
      ui.river.value = state.river;
      ui.showVectors.checked = state.showVectors;
      ui.showComponents.checked = state.showComponents;
      ui.showFormula.checked = state.showFormula;
      ui.showTrail.checked = state.showTrail;

      ui.speedValue.textContent = state.speed.toFixed(1);
      ui.angleValue.textContent = String(state.angle);
      ui.widthValue.textContent = String(state.W);
      ui.riverValue.textContent = state.river.toFixed(1);

      const relation = state.river > state.speed ? "流速 > 船速" : "流速 ≦ 船速";
      ui.conditionBadge.textContent = `${relation}（${state.river.toFixed(1)} m/s と ${state.speed.toFixed(1)} m/s）`;

      ui.start.disabled = state.running || state.done;
      ui.pause.disabled = !state.running;
      renderResults();
    }

    function velocity() {
      const rad = state.angle * Math.PI / 180;
      const boatX = -state.speed * Math.sin(rad);
      const boatY = state.speed * Math.cos(rad);
      return {
        boatX,
        boatY,
        riverX: state.river,
        riverY: 0,
        x: state.river + boatX,
        y: boatY
      };
    }

    function update(dt) {
      if (!state.running || state.done) return;
      const v = velocity();

      if (v.y <= 0) {
        state.running = false;
        state.done = true;
        state.result = { impossible: true, reason: "横断不能" };
        syncUI();
        return;
      }

      state.x += v.x * dt;
      state.y += v.y * dt;
      state.time += dt;
      state.trail.push({ x: state.x, y: state.y });
      if (state.trail.length > 900) state.trail.shift();

      if (state.y >= state.W) {
        const over = state.y - state.W;
        const ratio = v.y > 0 ? over / (v.y * dt) : 0;
        state.x -= v.x * dt * ratio;
        state.y = state.W;
        state.time -= dt * ratio;
        state.trail[state.trail.length - 1] = { x: state.x, y: state.y };
        state.running = false;
        state.done = true;
        state.result = makeResult();
        if (state.task === 2 && (state.bestTime === null || state.time < state.bestTime)) {
          state.bestTime = state.time;
        }
        syncUI();
      }
    }

    function makeResult() {
      const offset = state.x;
      const ok = Math.abs(offset) <= 2;
      return {
        offset,
        time: state.time,
        angle: state.angle,
        frontOk: ok,
        possibleFront: state.river <= state.speed
      };
    }

    function renderResults() {
      const rows = [];
      const r = state.result;
      const current = previewCrossing();

      if (state.task === 1) {
        rows.push(["到着点のずれ（左右）", r && !r.impossible ? formatOffset(r.offset) : "— m"]);
        rows.push(["横断時間", r && !r.impossible ? `${r.time.toFixed(1)} s` : current.time ? `${current.time.toFixed(1)} s` : "— s"]);
        rows.push(["正面到達判定", r ? judgeText(r) : "—"]);
      } else if (state.task === 2) {
        rows.push(["横断時間（到着までの時間）", r && !r.impossible ? `${r.time.toFixed(1)} s` : current.time ? `${current.time.toFixed(1)} s` : "— s"]);
        rows.push(["最短記録", state.bestTime !== null ? `${state.bestTime.toFixed(1)} s` : "—"]);
        rows.push(["到着時のずれ（左右）", r && !r.impossible ? formatOffset(r.offset) : current.offset !== null ? formatOffset(current.offset) : "— m"]);
        rows.push(["到着時の向き", r && !r.impossible ? `${r.angle}°` : `${state.angle}°`]);
      } else {
        rows.push(["正面到達判定", r ? judgeText(r) : state.river > state.speed ? "不可能な条件" : "—"]);
        rows.push(["到着の可否", r ? (r.impossible ? "横断不能" : "対岸に到着") : "—"]);
        rows.push(["到着点のずれ", r && !r.impossible ? formatOffset(r.offset) : current.offset !== null ? formatOffset(current.offset) : "— m"]);
        rows.push(["横断時間", r && !r.impossible ? `${r.time.toFixed(1)} s` : current.time ? `${current.time.toFixed(1)} s` : "— s"]);
      }

      ui.results.innerHTML = rows.map(([name, value]) =>
        `<div class="result-row"><span>${name}</span><span class="result-value">${value}</span></div>`
      ).join("");

      ui.formula.hidden = !state.showFormula;
      ui.formula.innerHTML = state.showFormula ? formulaHTML() : "";
    }

    function previewCrossing() {
      const v = velocity();
      if (v.y <= 0) return { time: null, offset: null };
      const time = state.W / v.y;
      return { time, offset: v.x * time };
    }

    function judgeText(r) {
      if (r.impossible) return "横断不能";
      if (state.task === 3 && state.river > state.speed) return "正面到達は不可能";
      if (r.frontOk) return "成功";
      return r.offset > 0 ? "下流にずれた" : "上流にずれた";
    }

    function formatOffset(x) {
      const side = Math.abs(x) <= .05 ? "正面" : x > 0 ? "下流" : "上流";
      return `${Math.abs(x).toFixed(1)} m ${side}`;
    }

    function formulaHTML() {
      const v = velocity();
      const lines = [
        "<code>v_地面 = v_船/水 + v_川</code>",
        `<code>v_x = v_r - v_b sinθ = ${v.x.toFixed(2)} m/s</code>`,
        `<code>v_y = v_b cosθ = ${v.y.toFixed(2)} m/s</code>`
      ];
      if (state.task !== 2) {
        lines.push("<code>正面到達条件：v_x = 0</code>");
        lines.push("<code>sinθ = v_r / v_b</code>");
      }
      if (state.task === 3 && state.river > state.speed) {
        lines.push("現在は <code>v_r / v_b > 1</code> なので、正面到達はできません。");
      }
      return lines.join("<br>");
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function view() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const bank = Math.max(86, h * .16);
      const riverTop = bank;
      const riverBottom = h - bank;
      const riverH = riverBottom - riverTop;
      const simTop = riverTop + 48;
      const simBottom = riverBottom - 48;
      const simH = Math.max(80, simBottom - simTop);
      const cx = w / 2;
      const scaleY = simH / state.W;
      const scaleX = Math.min(scaleY * .92, w / 230);
      return { w, h, bank, riverTop, riverBottom, riverH, simTop, simBottom, simH, cx, scaleX, scaleY };
    }

    function toPx(p) {
      const g = view();
      return {
        x: g.cx + p.x * g.scaleX,
        y: g.simBottom - p.y * g.scaleY
      };
    }

    function draw() {
      const g = view();
      ctx.clearRect(0, 0, g.w, g.h);
      drawBanks(g);
      drawRiver(g);
      drawGuide(g);
      drawTrail();
      drawVectors();
      drawBoat();
      drawStart(g);
    }

    function drawBanks(g) {
      const grass = ctx.createLinearGradient(0, 0, 0, g.h);
      grass.addColorStop(0, "#8fc64b");
      grass.addColorStop(.45, "#d7c391");
      grass.addColorStop(.55, "#d7c391");
      grass.addColorStop(1, "#7fb83f");
      ctx.fillStyle = grass;
      ctx.fillRect(0, 0, g.w, g.h);

      ctx.fillStyle = "#d8c59b";
      ctx.fillRect(0, g.riverTop - 22, g.w, 30);
      ctx.fillRect(0, g.riverBottom - 8, g.w, 34);

      drawPebbles(g.riverTop - 14, g.w, 44);
      drawPebbles(g.riverBottom - 4, g.w, 44);
      drawGrassTufts(g);
    }

    function drawPebbles(y, w, height) {
      for (let i = 0; i < 90; i++) {
        const x = (i * 73) % w;
        const yy = y + ((i * 29) % height);
        const r = 2 + (i % 5);
        ctx.fillStyle = i % 3 === 0 ? "#9d9a8c" : i % 3 === 1 ? "#c6bfa9" : "#747b73";
        ctx.beginPath();
        ctx.ellipse(x, yy, r + 2, r, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGrassTufts(g) {
      ctx.strokeStyle = "rgba(43, 105, 31, .6)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 46; i++) {
        const top = i % 2 === 0;
        const x = (i * 137) % g.w;
        const y = top ? 25 + (i * 31) % 48 : g.h - 24 - (i * 37) % 48;
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + k * 5, y - 15 + Math.abs(k) * 2);
          ctx.stroke();
        }
      }
    }

    function drawRiver(g) {
      const water = ctx.createLinearGradient(0, g.riverTop, 0, g.riverBottom);
      water.addColorStop(0, "#4bb1dc");
      water.addColorStop(.5, "#30a5d8");
      water.addColorStop(1, "#42b7df");
      ctx.fillStyle = water;
      ctx.fillRect(0, g.riverTop, g.w, g.riverH);

      ctx.strokeStyle = "rgba(255, 255, 255, .18)";
      ctx.lineWidth = 2;
      for (let y = g.riverTop + 28; y < g.riverBottom - 18; y += 28) {
        ctx.beginPath();
        for (let x = 0; x <= g.w + 20; x += 22) {
          const yy = y + Math.sin((x + y) * .025) * 3;
          if (x === 0) ctx.moveTo(x, yy);
          else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }

      const strength = state.task === 3 ? .42 : .28;
      for (let row = 0; row < 3; row++) {
        const y = g.riverTop + g.riverH * (.25 + row * .25);
        for (let x = 105; x < g.w - 80; x += 265) {
          drawArrow(x, y, x + 86, y, `rgba(210, 242, 255, ${strength})`, 6);
        }
      }
    }

    function drawGuide(g) {
      if (state.task === 2) return;
      const start = toPx({ x: 0, y: 0 });
      const goal = toPx({ x: 0, y: state.W });
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, .95)";
      ctx.lineWidth = 3;
      ctx.setLineDash([9, 9]);
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(goal.x, goal.y);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#d7272e";
      roundRect(goal.x - 39, goal.y - 58, 78, 29, 7, true);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("ゴール", goal.x, goal.y - 37);

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(goal.x, goal.y - 4, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e52d35";
      for (const r of [23, 14, 6]) {
        ctx.beginPath();
        ctx.arc(goal.x, goal.y - 4, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = ctx.fillStyle === "#e52d35" ? "#fff" : "#e52d35";
      }
    }

    function drawStart(g) {
      const p = toPx({ x: 0, y: 0 });
      ctx.fillStyle = "#0f69c8";
      roundRect(p.x - 48, p.y + 62, 96, 30, 8, true);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("スタート", p.x, p.y + 84);
    }

    function drawTrail() {
      if (!state.showTrail || state.trail.length < 2) return;
      ctx.save();
      ctx.strokeStyle = "#083f88";
      ctx.lineWidth = 3;
      ctx.globalAlpha = .75;
      ctx.beginPath();
      state.trail.forEach((p, i) => {
        const q = toPx(p);
        if (i === 0) ctx.moveTo(q.x, q.y);
        else ctx.lineTo(q.x, q.y);
      });
      ctx.stroke();
      ctx.restore();
    }

    function drawBoat() {
      const p = toPx({ x: state.x, y: state.y });
      const angle = state.angle * Math.PI / 180;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(-angle);
      ctx.shadowColor = "rgba(0, 0, 0, .25)";
      ctx.shadowBlur = 7;
      ctx.shadowOffsetY = 3;

      ctx.fillStyle = "#f8fbff";
      ctx.strokeStyle = "#1f2a3a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -52);
      ctx.quadraticCurveTo(25, -22, 18, 48);
      ctx.quadraticCurveTo(0, 58, -18, 48);
      ctx.quadraticCurveTo(-25, -22, 0, -52);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#1d68b7";
      roundRect(-13, -28, 26, 14, 4, true);
      ctx.fillStyle = "#bd7831";
      roundRect(-14, 8, 12, 25, 4, true);
      roundRect(2, 8, 12, 25, 4, true);
      ctx.fillStyle = "#2c3138";
      roundRect(-7, 43, 14, 20, 5, true);
      ctx.restore();
    }

    function drawVectors() {
      if (!state.showVectors) return;
      const p = toPx({ x: state.x, y: state.y });
      const v = velocity();
      const scale = 22;
      const boatEnd = { x: p.x + v.boatX * scale, y: p.y - v.boatY * scale };
      const riverEnd = { x: p.x + v.riverX * scale, y: p.y };
      const groundEnd = { x: p.x + v.x * scale, y: p.y - v.y * scale };

      drawArrow(p.x, p.y, boatEnd.x, boatEnd.y, "#f08a22", 4);
      drawVectorLabel("水に対する船の速度", boatEnd.x, boatEnd.y, "#a34e00");
      drawArrow(p.x, p.y, riverEnd.x, riverEnd.y, "#18a1a8", 4);
      drawVectorLabel("川の流れ", riverEnd.x, riverEnd.y + 18, "#08777e");
      drawArrow(p.x, p.y, groundEnd.x, groundEnd.y, "#d31e3a", 4);
      drawVectorLabel("地面から見た速度", groundEnd.x, groundEnd.y - 16, "#a5142b");

      if (state.showComponents) {
        ctx.save();
        ctx.strokeStyle = "rgba(211, 30, 58, .65)";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(groundEnd.x, p.y);
        ctx.lineTo(groundEnd.x, groundEnd.y);
        ctx.stroke();
        ctx.restore();
        drawVectorLabel(`v_x=${v.x.toFixed(1)}`, (p.x + groundEnd.x) / 2, p.y + 18, "#a5142b");
        drawVectorLabel(`v_y=${v.y.toFixed(1)}`, groundEnd.x + 28, (p.y + groundEnd.y) / 2, "#a5142b");
      }
    }

    function drawVectorLabel(text, x, y, color) {
      ctx.save();
      ctx.font = "bold 12px sans-serif";
      const width = ctx.measureText(text).width + 12;
      ctx.fillStyle = "rgba(255, 255, 255, .88)";
      roundRect(x - width / 2, y - 11, width, 20, 5, true);
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.fillText(text, x, y + 4);
      ctx.restore();
    }

    function drawArrow(x1, y1, x2, y2, color, width) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const head = 14;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function roundRect(x, y, w, h, r, fill) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      else ctx.stroke();
    }

    function frame(now) {
      if (!state.lastFrame) state.lastFrame = now;
      const dt = Math.min((now - state.lastFrame) / 1000, .04);
      state.lastFrame = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    function softResetMotion() {
      state.running = false;
      state.done = false;
      state.time = 0;
      state.x = 0;
      state.y = 0;
      state.trail = [{ x: 0, y: 0 }];
      state.result = null;
      syncUI();
      draw();
    }

    ui.tabs.forEach(tab => tab.addEventListener("click", () => setTask(Number(tab.dataset.task))));
    ui.start.addEventListener("click", () => {
      state.running = true;
      state.lastFrame = 0;
      syncUI();
    });
    ui.pause.addEventListener("click", () => {
      state.running = false;
      syncUI();
    });
    ui.reset.addEventListener("click", () => resetTask(state.task));

    ui.speed.addEventListener("input", () => {
      state.speed = Number(ui.speed.value);
      softResetMotion();
    });
    ui.angle.addEventListener("input", () => {
      state.angle = Number(ui.angle.value);
      softResetMotion();
    });
    ui.width.addEventListener("input", () => {
      state.W = Number(ui.width.value);
      softResetMotion();
    });
    ui.river.addEventListener("input", () => {
      state.river = Number(ui.river.value);
      softResetMotion();
    });

    for (const [el, key] of [
      [ui.showVectors, "showVectors"],
      [ui.showComponents, "showComponents"],
      [ui.showFormula, "showFormula"],
      [ui.showTrail, "showTrail"]
    ]) {
      el.addEventListener("change", () => {
        state[key] = el.checked;
        syncUI();
        draw();
      });
    }

    window.addEventListener("resize", resizeCanvas);
    resetTask(1);
    resizeCanvas();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
