<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RLC直列回路：回転ベクトル図と交流波形</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --ink: #20242a;
      --muted: #63707a;
      --line: #d6dde2;
      --grid: #e9edf0;
      --accent: #0e7c7b;
      --i: #1f6feb;
      --v: #d33f49;
      --vr: #2f9e44;
      --vl: #7b4cc2;
      --vc: #c47f00;
      --shadow: 0 12px 28px rgba(34, 42, 50, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 1040px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      letter-spacing: 0;
    }

    header {
      padding: 18px 28px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfa;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(700px, 1fr) 326px;
      gap: 18px;
      padding: 18px;
      height: calc(100vh - 86px);
      min-height: 680px;
    }

    .workspace {
      display: grid;
      grid-template-rows: 178px minmax(0, 1fr);
      gap: 18px;
      min-width: 0;
      min-height: 0;
    }

    .visuals {
      display: grid;
      grid-template-columns: minmax(320px, 0.9fr) minmax(420px, 1.15fr);
      gap: 18px;
      min-height: 0;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      font-weight: 700;
      background: #fbfcfa;
    }

    canvas {
      display: block;
      width: 100%;
      height: calc(100% - 40px);
    }

    #circuitCanvas { height: 138px; }

    aside {
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .controls { padding: 14px; }

    .group {
      border-top: 1px solid var(--line);
      padding-top: 13px;
      margin-top: 13px;
    }

    .group:first-child {
      border-top: 0;
      padding-top: 0;
      margin-top: 0;
    }

    .group h2 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin: 11px 0;
    }

    .slider-row label,
    .time-row label {
      font-size: 13px;
      color: #29313a;
    }

    .value {
      min-width: 92px;
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    input[type="range"] {
      grid-column: 1 / 3;
      width: 100%;
      accent-color: var(--accent);
    }

    .checks {
      display: grid;
      gap: 8px;
    }

    .check {
      display: grid;
      grid-template-columns: 18px 14px 1fr;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.16);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button, select {
      border: 1px solid #b7c2c8;
      background: #ffffff;
      color: var(--ink);
      border-radius: 6px;
      min-height: 36px;
      font: inherit;
      font-size: 13px;
    }

    button { cursor: pointer; }

    button.primary {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
    }

    select {
      width: 100%;
      padding: 0 10px;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(14, 124, 123, 0.25);
      outline-offset: 2px;
    }

    .time-row { margin-top: 12px; }

    .readout {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      margin: 0;
      font-size: 13px;
    }

    .readout dt { color: var(--muted); }

    .readout dd {
      margin: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    details {
      font-size: 13px;
      color: var(--muted);
    }

    summary {
      cursor: pointer;
      color: #29313a;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .formula {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: Consolas, "Courier New", monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>RLC直列回路：回転ベクトル図と交流波形</h1>
    <p>スライダーを動かして、回転ベクトル図と波形の変化を観察してください。</p>
  </header>

  <main>
    <section class="workspace" aria-label="表示エリア">
      <section class="panel">
        <div class="panel-title">RLC直列回路</div>
        <canvas id="circuitCanvas" width="900" height="180"></canvas>
      </section>

      <section class="visuals">
        <section class="panel">
          <div class="panel-title">回転ベクトル図</div>
          <canvas id="vectorCanvas" width="560" height="520"></canvas>
        </section>
        <section class="panel">
          <div class="panel-title">時間変化グラフ</div>
          <canvas id="waveCanvas" width="720" height="520"></canvas>
        </section>
      </section>
    </section>

    <aside>
      <section class="panel controls" aria-label="操作パネル">
        <div class="group">
          <h2>回路定数</h2>
          <div class="slider-row">
            <label for="r">抵抗 R</label>
            <span class="value" id="rValue"></span>
            <input id="r" type="range" min="10" max="500" step="10">
          </div>
          <div class="slider-row">
            <label for="l">自己インダクタンス L</label>
            <span class="value" id="lValue"></span>
            <input id="l" type="range" min="10" max="500" step="10">
          </div>
          <div class="slider-row">
            <label for="c">電気容量 C</label>
            <span class="value" id="cValue"></span>
            <input id="c" type="range" min="10" max="500" step="10">
          </div>
          <div class="slider-row">
            <label for="f">周波数 f</label>
            <span class="value" id="fValue"></span>
            <input id="f" type="range" min="10" max="200" step="1">
          </div>
          <div class="slider-row">
            <label for="v0">電源電圧の最大値 V0</label>
            <span class="value" id="v0Value"></span>
            <input id="v0" type="range" min="1" max="100" step="1">
          </div>
        </div>

        <div class="group">
          <h2>表示</h2>
          <div class="checks">
            <label class="check"><input id="showI" type="checkbox"><span class="swatch" style="background: var(--i)"></span>電流 I / i(t)</label>
            <label class="check"><input id="showV" type="checkbox"><span class="swatch" style="background: var(--v)"></span>電源電圧 V / v(t)</label>
            <label class="check"><input id="showVR" type="checkbox"><span class="swatch" style="background: var(--vr)"></span>抵抗の電圧 VR / vR(t)</label>
            <label class="check"><input id="showVL" type="checkbox"><span class="swatch" style="background: var(--vl)"></span>コイルの電圧 VL / vL(t)</label>
            <label class="check"><input id="showVC" type="checkbox"><span class="swatch" style="background: var(--vc)"></span>コンデンサの電圧 VC / vC(t)</label>
          </div>
        </div>

        <div class="group">
          <h2>アニメーション</h2>
          <div class="buttons">
            <button id="playPause" class="primary" type="button">一時停止</button>
            <button id="reset" type="button">リセット</button>
          </div>
          <div class="time-row">
            <label for="speed">速度</label>
            <select id="speed">
              <option value="0.45">遅い</option>
              <option value="1">標準</option>
              <option value="2">速い</option>
            </select>
          </div>
          <div class="slider-row">
            <label for="time">時刻</label>
            <span class="value" id="timeValue"></span>
            <input id="time" type="range" min="0" max="1" step="0.001">
          </div>
        </div>

        <div class="group">
          <h2>数値</h2>
          <dl class="readout">
            <dt>R</dt><dd id="readR"></dd>
            <dt>L</dt><dd id="readL"></dd>
            <dt>C</dt><dd id="readC"></dd>
            <dt>f</dt><dd id="readF"></dd>
            <dt>V0</dt><dd id="readV0"></dd>
            <dt>位相差 φ</dt><dd id="readPhi"></dd>
          </dl>
        </div>

        <div class="group">
          <details>
            <summary>式を表示</summary>
            <ul class="formula">
              <li>XL = ωL</li>
              <li>XC = 1/(ωC)</li>
              <li>Z = √(R² + (XL - XC)²)</li>
            </ul>
          </details>
        </div>
      </section>
    </aside>
  </main>
  <script>
    const defaults = {
      r: 100,
      l: 100,
      c: 100,
      f: 50,
      v0: 10,
      showI: true,
      showV: true,
      showVR: false,
      showVL: false,
      showVC: false,
      speed: "1",
      phase: 0,
      playing: true
    };

    const els = {
      circuit: document.getElementById("circuitCanvas"),
      vector: document.getElementById("vectorCanvas"),
      wave: document.getElementById("waveCanvas"),
      r: document.getElementById("r"),
      l: document.getElementById("l"),
      c: document.getElementById("c"),
      f: document.getElementById("f"),
      v0: document.getElementById("v0"),
      showI: document.getElementById("showI"),
      showV: document.getElementById("showV"),
      showVR: document.getElementById("showVR"),
      showVL: document.getElementById("showVL"),
      showVC: document.getElementById("showVC"),
      speed: document.getElementById("speed"),
      time: document.getElementById("time"),
      playPause: document.getElementById("playPause"),
      reset: document.getElementById("reset")
    };

    const labels = {
      rValue: document.getElementById("rValue"),
      lValue: document.getElementById("lValue"),
      cValue: document.getElementById("cValue"),
      fValue: document.getElementById("fValue"),
      v0Value: document.getElementById("v0Value"),
      timeValue: document.getElementById("timeValue"),
      readR: document.getElementById("readR"),
      readL: document.getElementById("readL"),
      readC: document.getElementById("readC"),
      readF: document.getElementById("readF"),
      readV0: document.getElementById("readV0"),
      readPhi: document.getElementById("readPhi")
    };

    const colors = {
      I: css("--i"),
      V: css("--v"),
      VR: css("--vr"),
      VL: css("--vl"),
      VC: css("--vc")
    };

    let state = { ...defaults };
    let lastFrame = performance.now();

    setup();
    requestAnimationFrame(tick);

    function css(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function setup() {
      setControlValues();
      Object.values(els).forEach((el) => {
        if (el && (el.tagName === "INPUT" || el.tagName === "SELECT")) {
          el.addEventListener("input", readControls);
        }
      });
      els.playPause.addEventListener("click", () => {
        state.playing = !state.playing;
        syncButtons();
      });
      els.reset.addEventListener("click", () => {
        state = { ...defaults };
        setControlValues();
        drawAll();
      });
      window.addEventListener("resize", drawAll);
      drawAll();
    }

    function setControlValues() {
      els.r.value = state.r;
      els.l.value = state.l;
      els.c.value = state.c;
      els.f.value = state.f;
      els.v0.value = state.v0;
      els.showI.checked = state.showI;
      els.showV.checked = state.showV;
      els.showVR.checked = state.showVR;
      els.showVL.checked = state.showVL;
      els.showVC.checked = state.showVC;
      els.speed.value = state.speed;
      els.time.value = state.phase;
      syncButtons();
      updateLabels(calc());
    }

    function readControls(event) {
      state.r = Number(els.r.value);
      state.l = Number(els.l.value);
      state.c = Number(els.c.value);
      state.f = Number(els.f.value);
      state.v0 = Number(els.v0.value);
      state.showI = els.showI.checked;
      state.showV = els.showV.checked;
      state.showVR = els.showVR.checked;
      state.showVL = els.showVL.checked;
      state.showVC = els.showVC.checked;
      state.speed = els.speed.value;
      state.phase = Number(els.time.value);
      if (event && event.target === els.time) {
        state.playing = false;
        syncButtons();
      }
      drawAll();
    }

    function syncButtons() {
      els.playPause.textContent = state.playing ? "一時停止" : "再生";
      els.playPause.classList.toggle("primary", state.playing);
    }

    function calc() {
      const R = state.r;
      const L = state.l / 1000;
      const C = state.c * 1e-6;
      const f = state.f;
      const omega = 2 * Math.PI * f;
      const XL = omega * L;
      const XC = 1 / (omega * C);
      const reactance = XL - XC;
      const Z = Math.hypot(R, reactance);
      const V0 = state.v0;
      const I0 = V0 / Z;
      const VR0 = I0 * R;
      const VL0 = I0 * XL;
      const VC0 = I0 * XC;
      const phi = Math.atan2(reactance, R);
      const T = 1 / f;
      return { R, L, C, f, omega, XL, XC, Z, V0, I0, VR0, VL0, VC0, phi, T };
    }

    function tick(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      if (state.playing) {
        state.phase = (state.phase + dt * 0.18 * Number(state.speed)) % 1;
        els.time.value = state.phase;
      }
      drawAll();
      requestAnimationFrame(tick);
    }

    function drawAll() {
      const data = calc();
      updateLabels(data);
      drawCircuit();
      drawVector(data);
      drawWave(data);
    }

    function updateLabels(data) {
      labels.rValue.textContent = `${state.r} ﾎｩ`;
      labels.lValue.textContent = `${state.l} mH`;
      labels.cValue.textContent = `${state.c} ﾎｼF`;
      labels.fValue.textContent = `${state.f} Hz`;
      labels.v0Value.textContent = `${state.v0} V`;
      labels.timeValue.textContent = `${(state.phase * data.T).toFixed(4)} s`;
      labels.readR.textContent = `${state.r} ﾎｩ`;
      labels.readL.textContent = `${state.l} mH`;
      labels.readC.textContent = `${state.c} ﾎｼF`;
      labels.readF.textContent = `${state.f} Hz`;
      labels.readV0.textContent = `${state.v0} V`;
      labels.readPhi.textContent = `${signed(Math.round(data.phi * 180 / Math.PI))}ﾂｰ`;
    }

    function signed(value) {
      return value > 0 ? `+${value}` : `${value}`;
    }

    function fitCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, w: rect.width, h: rect.height };
    }

    function clear(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
    }

    function drawCircuit() {
      const { ctx, w, h } = fitCanvas(els.circuit);
      clear(ctx, w, h);
      const cx = w / 2;
      const yTop = 32;
      const yBottom = h - 30;
      const left = Math.max(90, cx - 310);
      const right = Math.min(w - 90, cx + 310);
      const y = yTop;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#28323c";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(left, y);
      ctx.lineTo(left + 76, y);
      ctx.stroke();

      drawResistor(ctx, left + 76, y, left + 190, y);
      wire(ctx, left + 190, y, left + 230, y);
      drawCoil(ctx, left + 230, y, left + 365, y);
      wire(ctx, left + 365, y, left + 410, y);
      drawCapacitor(ctx, left + 410, y, left + 500, y);
      wire(ctx, left + 500, y, right, y);

      ctx.beginPath();
      ctx.moveTo(right, y);
      ctx.lineTo(right, yBottom);
      ctx.lineTo(left, yBottom);
      ctx.lineTo(left, y + 42);
      ctx.stroke();

      drawSource(ctx, left, y + 21, 22);
      drawCircuitLabel(ctx, "交流電源", left + 10, yBottom - 24, "#28323c", "left");
      drawCircuitLabel(ctx, "R", left + 133, y + 37, colors.VR, "center");
      drawCircuitLabel(ctx, "L", left + 298, y + 37, colors.VL, "center");
      drawCircuitLabel(ctx, "C", left + 456, y + 37, colors.VC, "center");
      ctx.restore();
    }

    function wire(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawSource(ctx, x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 36; i++) {
        const t = i / 36;
        const px = x - 14 + 28 * t;
        const py = y + Math.sin(t * Math.PI * 2) * 7;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.lineWidth = 3;
    }

    function drawResistor(ctx, x1, y1, x2, y2) {
      const n = 6;
      const step = (x2 - x1) / (n + 1);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      for (let i = 1; i <= n; i++) {
        ctx.lineTo(x1 + step * i, y1 + (i % 2 ? -13 : 13));
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCoil(ctx, x1, y1, x2, y2) {
      const loops = 5;
      const r = (x2 - x1) / (loops * 2);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      for (let i = 0; i < loops; i++) {
        ctx.arc(x1 + r * (2 * i + 1), y1, r, Math.PI, 0, false);
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCapacitor(ctx, x1, y1, x2, y2) {
      const mid = (x1 + x2) / 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(mid - 9, y1);
      ctx.moveTo(mid - 9, y1 - 22);
      ctx.lineTo(mid - 9, y1 + 22);
      ctx.moveTo(mid + 9, y1 - 22);
      ctx.lineTo(mid + 9, y1 + 22);
      ctx.moveTo(mid + 9, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCircuitLabel(ctx, text, x, y, color, align) {
      ctx.fillStyle = color;
      ctx.font = "14px sans-serif";
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
    }

    function drawVector(data) {
      const { ctx, w, h } = fitCanvas(els.vector);
      clear(ctx, w, h);
      const cx = w / 2;
      const cy = h / 2 + 8;
      const radius = Math.min(w, h) * 0.36;
      const theta = state.phase * Math.PI * 2;
      const values = vectorValues(data, theta);
      const shownVoltages = ["V", "VR", "VL", "VC"].filter(isShown).map((k) => values[k].amp);
      const voltageLimit = autoLimit(shownVoltages, 1);
      const currentLimit = autoLimit(state.showI ? [values.I.amp] : [], 1);
      const vScale = radius / voltageLimit;
      const iScale = radius / currentLimit;

      drawVectorAxes(ctx, cx, cy, w, h);
      drawScaleNote(ctx, w, h, voltageLimit, currentLimit);

      if (state.showI) drawArrow(ctx, cx, cy, values.I.x * iScale, values.I.y * iScale, colors.I, "I");
      if (state.showVR) drawArrow(ctx, cx, cy, values.VR.x * vScale, values.VR.y * vScale, colors.VR, "VR");
      if (state.showVL) drawArrow(ctx, cx, cy, values.VL.x * vScale, values.VL.y * vScale, colors.VL, "VL");
      if (state.showVC) drawArrow(ctx, cx, cy, values.VC.x * vScale, values.VC.y * vScale, colors.VC, "VC");
      if (state.showV) drawArrow(ctx, cx, cy, values.V.x * vScale, values.V.y * vScale, colors.V, "V");
    }

    function vectorValues(data, theta) {
      return {
        I: fromPolar(data.I0, theta),
        VR: fromPolar(data.VR0, theta),
        VL: fromPolar(data.VL0, theta + Math.PI / 2),
        VC: fromPolar(data.VC0, theta - Math.PI / 2),
        V: fromPolar(data.V0, theta + data.phi)
      };
    }

    function fromPolar(amp, angle) {
      return { amp, x: amp * Math.cos(angle), y: amp * Math.sin(angle) };
    }

    function isShown(key) {
      return (
        (key === "I" && state.showI) ||
        (key === "V" && state.showV) ||
        (key === "VR" && state.showVR) ||
        (key === "VL" && state.showVL) ||
        (key === "VC" && state.showVC)
      );
    }

    function drawVectorAxes(ctx, cx, cy, w, h) {
      ctx.strokeStyle = "#c8d0d6";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(38, cy);
      ctx.lineTo(w - 38, cy);
      ctx.moveTo(cx, 36);
      ctx.lineTo(cx, h - 38);
      ctx.stroke();
    }

    function drawScaleNote(ctx, w, h, maxV, maxI) {
      ctx.fillStyle = "#66717b";
      ctx.font = "12px sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(`電圧軸 ±${formatNumber(maxV)} V（自動）`, 14, h - 48);
      ctx.fillText(`電流軸 ±${formatNumber(maxI)} A（自動）`, 14, h - 30);
    }

    function drawArrow(ctx, cx, cy, vx, vy, color, text) {
      const x = cx + vx;
      const y = cy - vy;
      const angle = Math.atan2(-vy, vx);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 11 * Math.cos(angle - 0.45), y - 11 * Math.sin(angle - 0.45));
      ctx.lineTo(x - 11 * Math.cos(angle + 0.45), y - 11 * Math.sin(angle + 0.45));
      ctx.closePath();
      ctx.fill();
      drawText(ctx, text, x + (vx >= 0 ? 10 : -10), y + (vy >= 0 ? -8 : 18), color, vx >= 0 ? "left" : "right");
    }

    function drawWave(data) {
      const { ctx, w, h } = fitCanvas(els.wave);
      clear(ctx, w, h);
      const pad = { left: 72, right: 72, top: 36, bottom: 52 };
      const plotW = w - pad.left - pad.right;
      const plotH = h - pad.top - pad.bottom;
      const x0 = pad.left;
      const y0 = pad.top;
      const mid = y0 + plotH / 2;
      const visible = waveSeries(data).filter((s) => s.shown);
      const voltageLimit = autoLimit(visible.filter((s) => s.unit === "V").map((s) => s.amp), 1);
      const currentLimit = autoLimit(visible.filter((s) => s.unit === "A").map((s) => s.amp), 1);
      const vScale = plotH / 2 / voltageLimit;
      const iScale = plotH / 2 / currentLimit;

      drawWaveGrid(ctx, x0, y0, plotW, plotH, mid, voltageLimit, currentLimit, data.T);

      visible.forEach((item) => {
        ctx.strokeStyle = item.color;
        ctx.lineWidth = item.key === "V" || item.key === "I" ? 2.5 : 2;
        ctx.beginPath();
        const steps = Math.max(2, Math.floor(plotW * state.phase));
        for (let i = 0; i <= steps; i++) {
          const progress = state.phase === 0 ? 0 : (i / steps) * state.phase;
          const t = progress * data.T;
          const yScale = item.unit === "A" ? iScale : vScale;
          const px = x0 + progress * plotW;
          const py = mid - item.fn(t) * yScale;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      });

      const markerX = x0 + state.phase * plotW;
      drawMarker(ctx, markerX, y0, plotH);
      drawLegend(ctx, x0 + 12, y0 + 12, visible);
      drawText(ctx, "時刻 t [s]", x0 + plotW, y0 + plotH + 32, "#59636d", "right");
      drawText(ctx, "電圧 [V]（自動）", x0, y0 - 16, "#59636d", "left");
      drawText(ctx, "電流 [A]（自動）", x0 + plotW, y0 - 16, "#59636d", "right");
    }

    function waveSeries(data) {
      return [
        { key: "I", shown: state.showI, unit: "A", amp: data.I0, color: colors.I, label: "i(t)", fn: (t) => data.I0 * Math.sin(data.omega * t) },
        { key: "V", shown: state.showV, unit: "V", amp: data.V0, color: colors.V, label: "v(t)", fn: (t) => voltageAt(data, t) },
        { key: "VR", shown: state.showVR, unit: "V", amp: data.VR0, color: colors.VR, label: "vR(t)", fn: (t) => data.VR0 * Math.sin(data.omega * t) },
        { key: "VL", shown: state.showVL, unit: "V", amp: data.VL0, color: colors.VL, label: "vL(t)", fn: (t) => data.VL0 * Math.sin(data.omega * t + Math.PI / 2) },
        { key: "VC", shown: state.showVC, unit: "V", amp: data.VC0, color: colors.VC, label: "vC(t)", fn: (t) => data.VC0 * Math.sin(data.omega * t - Math.PI / 2) }
      ];
    }

    function voltageAt(data, t) {
      const a = data.omega * t;
      return data.VR0 * Math.sin(a) +
        data.VL0 * Math.sin(a + Math.PI / 2) +
        data.VC0 * Math.sin(a - Math.PI / 2);
    }

    function drawWaveGrid(ctx, x, y, w, h, mid, voltageMax, currentMax, period) {
      ctx.strokeStyle = "#e6eaed";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const px = x + w * i / 4;
        ctx.moveTo(px, y);
        ctx.lineTo(px, y + h);
      }
      for (let i = -2; i <= 2; i++) {
        const py = mid - h * i / 4;
        ctx.moveTo(x, py);
        ctx.lineTo(x + w, py);
      }
      ctx.stroke();

      ctx.strokeStyle = "#9da8b1";
      ctx.beginPath();
      ctx.moveTo(x, mid);
      ctx.lineTo(x + w, mid);
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + h);
      ctx.moveTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      ctx.stroke();

      ctx.fillStyle = "#66717b";
      ctx.font = "12px sans-serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "right";
      [-voltageMax, 0, voltageMax].forEach((v) => {
        const py = mid - v * (h / 2 / voltageMax);
        ctx.fillText(formatNumber(v), x - 8, py);
      });
      ctx.textAlign = "left";
      [-currentMax, 0, currentMax].forEach((v) => {
        const py = mid - v * (h / 2 / currentMax);
        ctx.fillText(formatNumber(v), x + w + 8, py);
      });
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      [0, 0.25, 0.5, 0.75, 1].forEach((p) => {
        ctx.fillText(formatTime(period * p), x + w * p, y + h + 8);
      });
    }

    function drawMarker(ctx, x, y, h) {
      ctx.strokeStyle = "#1f2933";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + h);
      ctx.stroke();
    }

    function drawLegend(ctx, x, y, items) {
      ctx.font = "12px sans-serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      let px = x;
      let py = y;
      items.forEach((item) => {
        const text = `${item.label} [${item.unit}]`;
        const width = ctx.measureText(text).width + 30;
        if (px + width > x + 430) {
          px = x;
          py += 20;
        }
        ctx.fillStyle = item.color;
        ctx.fillRect(px, py - 5, 16, 3);
        ctx.fillText(text, px + 22, py);
        px += width + 10;
      });
    }

    function drawText(ctx, text, x, y, color, align) {
      ctx.fillStyle = color;
      ctx.font = "13px sans-serif";
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
    }

    function autoLimit(values, fallback) {
      const usable = values.filter((value) => Number.isFinite(value) && value > 0);
      if (usable.length === 0) return fallback;
      return nice(Math.max(...usable) * 1.2);
    }

    function nice(value) {
      if (!Number.isFinite(value) || value <= 0) return 1;
      const pow = Math.pow(10, Math.floor(Math.log10(value)));
      const n = value / pow;
      const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
      return step * pow;
    }

    function formatNumber(value) {
      if (Math.abs(value) < 1e-12) return "0";
      const signedValue = value;
      if (Math.abs(signedValue) >= 100) return String(Math.round(signedValue));
      if (Math.abs(signedValue) >= 10) return signedValue.toFixed(0);
      if (Math.abs(signedValue) >= 1) return signedValue.toFixed(1).replace(/\.0$/, "");
      if (Math.abs(signedValue) >= 0.01) return signedValue.toFixed(2).replace(/0$/, "").replace(/\.0$/, "");
      return signedValue.toExponential(1);
    }

    function formatTime(value) {
      if (value < 0.01) return value.toFixed(4);
      if (value < 0.1) return value.toFixed(3);
      return value.toFixed(2);
    }
  </script>
</body>
