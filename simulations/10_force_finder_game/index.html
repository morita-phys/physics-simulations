<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>力探しゲーム</title>
  <style>
    :root {
      --blue: #1467bd;
      --blue-dark: #0c4f96;
      --green: #248a32;
      --green-soft: #eaf7ec;
      --red: #cf2d22;
      --red-soft: #fff0ee;
      --ink: #111827;
      --muted: #667085;
      --line: #c9d3df;
      --panel: #ffffff;
      --soft: #f5f8fb;
      --disabled: #e8edf3;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f6fa;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }

    .top-status {
      display: grid;
      grid-template-columns: auto auto minmax(220px, 1fr);
      align-items: stretch;
      gap: 10px;
      min-width: 0;
    }

    .status-chip,
    .feedback {
      min-height: 54px;
      padding: 10px 14px;
      border: 2px solid #a9c1df;
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .status-chip {
      white-space: nowrap;
    }

    .feedback {
      border-color: var(--blue);
      color: var(--blue-dark);
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(420px, 1.35fr) minmax(320px, 0.95fr) minmax(360px, 1.1fr);
      gap: 12px;
      min-height: 0;
    }

    .panel {
      position: relative;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-blue {
      border-color: var(--blue);
    }

    .panel-green {
      border-color: var(--green);
      background: linear-gradient(180deg, #fff, #fbfffb);
    }

    .panel-red {
      border-color: var(--red);
    }

    .panel-title {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      margin: 12px 14px 0;
      padding: 6px 16px;
      border-radius: 5px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
    }

    .title-blue {
      background: var(--blue);
    }

    .title-green {
      background: var(--green);
    }

    .title-red {
      background: var(--red);
    }

    .title-amber {
      background: #b76500;
    }

    .panel-body {
      padding: 18px 20px 16px;
    }

    .instruction {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 900;
    }

    .info-box {
      width: min(100%, 520px);
      margin: 0 auto 16px;
      padding: 16px 22px;
      border: 1.5px solid var(--blue);
      border-radius: 8px;
      background: #f8fbff;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.9;
    }

    .scene-wrap {
      display: flex;
      justify-content: center;
      margin: 0 auto 12px;
    }

    svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .actor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0;
    }

    .actor-card {
      display: grid;
      place-items: center;
      gap: 6px;
      min-height: 104px;
      padding: 10px 8px;
      border: 2px solid var(--blue);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-weight: 900;
      font-size: 18px;
    }

    .actor-card:nth-child(2) {
      border-color: var(--green);
    }

    .actor-card:nth-child(3) {
      border-color: #8a3fc1;
    }

    .actor-card:nth-child(4) {
      border-color: #d97706;
    }

    .actor-card:hover,
    .choice-card:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
    }

    .actor-card.selected,
    .choice-card.selected {
      outline: 3px solid #ffbf3f;
      outline-offset: 2px;
    }

    .actor-card.found {
      background: #f0f9f1;
      border-style: dashed;
    }

    .actor-icon {
      width: 58px;
      height: 58px;
    }

    .middle-column {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
      min-height: 0;
    }

    .steps-block {
      margin-top: 6px;
      padding-top: 4px;
    }

    .steps {
      list-style: none;
      margin: 0;
      padding: 0 4px;
      display: grid;
      gap: 10px;
      font-size: 16px;
      font-weight: 800;
    }

    .step {
      display: grid;
      grid-template-columns: 22px 34px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 34px;
    }

    .step-marker {
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
    }

    .step-num {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #fff;
      background: #86b78a;
      font-weight: 900;
    }

    .step.active .step-num {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(36, 138, 50, 0.16);
    }

    .step-target {
      color: var(--ink);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice-card {
      min-height: 68px;
      padding: 10px 12px;
      border: 1.5px solid #aeb9c8;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .choice-card:disabled {
      background: var(--disabled);
      color: #8792a2;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .arrow-mark {
      color: var(--blue);
      font-size: 38px;
      line-height: 1;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .choice-text {
      line-height: 1.45;
    }

    .choice-note {
      display: block;
      color: inherit;
      font-size: 14px;
      line-height: 1.35;
    }

    .right-column {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      min-height: 0;
    }

    .current-list {
      display: grid;
      gap: 14px;
      font-size: 19px;
      font-weight: 900;
    }

    .current-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: baseline;
      gap: 8px;
    }

    .current-value {
      color: var(--blue);
    }

    .add-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(100%, 280px);
      margin: 22px auto 0;
      padding: 14px 18px;
      border: 1px solid #aeb9c8;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .add-button:disabled {
      background: #e7ebf0;
      color: #8c96a5;
      cursor: not-allowed;
    }

    .add-button .circle {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      display: grid;
      place-items: center;
      font-size: 19px;
      line-height: 1;
    }

    .diagram-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .clear-mini {
      border: 1px solid #aeb9c8;
      border-radius: 6px;
      background: #fff;
      padding: 7px 12px;
      color: #667085;
      cursor: pointer;
      font-weight: 800;
    }

    .diagram-note {
      margin: 6px 0 0;
      font-size: 14px;
      line-height: 1.7;
      font-weight: 700;
    }

    .feedback.error {
      color: #b42318;
      border-color: #d92d20;
      background: #fff7f5;
    }

    .feedback.success {
      color: var(--green);
      border-color: var(--green);
      background: var(--green-soft);
    }

    .screen-reader {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .force-arrow {
      stroke: var(--red);
      stroke-width: 5;
      marker-end: url(#arrowHead);
    }

    .preview-arrow {
      stroke: #e89a22;
      stroke-width: 4;
      stroke-dasharray: 8 7;
      marker-end: url(#previewHead);
    }

    .force-label {
      fill: var(--red);
      font-weight: 900;
      font-size: 18px;
    }

    @media (max-width: 1180px) {
      .app {
        padding: 12px;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .middle-column,
      .right-column {
        grid-template-rows: auto;
      }

      .topbar,
      .top-status {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    @media (max-width: 620px) {
      .actor-grid,
      .choice-grid {
        grid-template-columns: 1fr 1fr;
      }

      .current-row {
        grid-template-columns: 90px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>力探しゲーム</h1>
      <div class="top-status" aria-live="polite">
        <div class="status-chip">ステージ： 1 / 5　<span id="stageTitle">机の上の本</span></div>
        <div class="status-chip">見つけた力の数： <span id="foundCount">0</span> / 2</div>
        <div class="feedback" id="feedback">中央のカードを上から順に選んで、力を作りましょう。</div>
      </div>
    </header>

    <main class="main-grid">
      <section class="panel panel-blue" aria-labelledby="scene-title">
        <div class="panel-title title-blue" id="scene-title">状況図（横から見た図）</div>
        <div class="panel-body">
          <div class="info-box">
            <div>着目物体： <span id="targetText">本</span></div>
            <div>運動の状態： <span id="motionText">静止している（机の上に静止）</span></div>
          </div>

          <div class="scene-wrap" aria-label="机の上に本が静止している横から見た図">
            <svg viewBox="0 0 560 260" role="img">
              <title>横から見た机の上の本</title>
              <rect x="55" y="145" width="450" height="22" fill="#c7a16d" stroke="#111" stroke-width="2"></rect>
              <rect x="78" y="167" width="18" height="60" fill="#d8d8d8" stroke="#111" stroke-width="2"></rect>
              <rect x="470" y="167" width="18" height="60" fill="#d8d8d8" stroke="#111" stroke-width="2"></rect>
              <g aria-label="本">
                <rect x="205" y="95" width="154" height="50" rx="12" fill="#81c279" stroke="#111" stroke-width="2.2"></rect>
                <path d="M350 95 C342 103 342 137 350 145 L378 145 L378 95 Z" fill="#f8fbff" stroke="#111" stroke-width="2.2"></path>
                <path d="M355 103 H377 M354 111 H377 M354 119 H377 M355 127 H377 M357 135 H377" stroke="#9aa3ad" stroke-width="1.5"></path>
                <text x="282" y="77" text-anchor="middle" font-size="17" font-weight="900" fill="#0c4f96">着目物体：本</text>
              </g>
            </svg>
          </div>

          <div class="steps-block">
            <div class="panel-title title-green" id="steps-title">手順</div>
            <div class="panel-body">
              <ol class="steps" id="stepsList"></ol>
            </div>
          </div>
        </div>
      </section>

      <div class="middle-column">
        <section class="panel panel-blue" aria-labelledby="actor-title">
          <div class="panel-title title-blue" id="actor-title">力の行為者カードを選ぼう</div>
          <div class="panel-body">
            <div class="actor-grid" id="actorGrid" aria-label="行為者候補"></div>
          </div>
        </section>

        <section class="panel panel-blue" aria-labelledby="direction-title">
          <div class="panel-title title-blue" id="direction-title">向きカードを選ぼう</div>
          <div class="panel-body">
            <div class="choice-grid" id="directionGrid"></div>
          </div>
        </section>

        <section class="panel" aria-labelledby="force-title" style="border-color:#b76500;">
          <div class="panel-title title-amber" id="force-title">力の名前カードを選ぼう</div>
          <div class="panel-body">
            <div class="choice-grid" id="forceGrid"></div>
          </div>
        </section>
      </div>

      <div class="right-column">
        <section class="panel panel-green" aria-labelledby="current-title">
          <div class="panel-title title-green" id="current-title">いま考えている力（作成中）</div>
          <div class="panel-body">
            <div class="current-list" aria-live="polite">
              <div class="current-row"><span>対象物体：</span><span id="currentTarget">本</span></div>
              <div class="current-row"><span>行為者：</span><span class="current-value" id="currentActor">未選択</span></div>
              <div class="current-row"><span>向き：</span><span class="current-value" id="currentDirection">未選択</span></div>
              <div class="current-row"><span>力の名前：</span><span class="current-value" id="currentForce">未選択</span></div>
            </div>
            <button class="add-button" id="addButton" type="button" disabled>
              自由物体図に追加 <span class="circle">→</span>
            </button>
          </div>
        </section>

        <section class="panel panel-red" aria-labelledby="fbd-title">
          <div class="diagram-head">
            <div class="panel-title title-red" id="fbd-title">自由物体図（横から見た図）</div>
            <button class="clear-mini" id="clearDiagramButton" type="button">すべてクリア</button>
          </div>
          <div class="panel-body">
            <div class="scene-wrap">
              <svg id="fbdSvg" viewBox="0 0 420 270" role="img" aria-label="本の自由物体図">
                <defs>
                  <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf2d22"></path>
                  </marker>
                  <marker id="previewHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e89a22"></path>
                  </marker>
                </defs>
                <line x1="70" y1="145" x2="360" y2="145" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="8 6"></line>
                <line x1="210" y1="228" x2="210" y2="45" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="8 6"></line>
                <path d="M360 145 l-12 -7 v14 z" fill="#9aa3ad"></path>
                <path d="M210 45 l-7 12 h14 z" fill="#9aa3ad"></path>
                <text x="372" y="153" fill="#667085" font-size="18" font-weight="900">x</text>
                <text x="202" y="32" fill="#667085" font-size="18" font-weight="900">y</text>
                <rect x="145" y="125" width="130" height="38" fill="#81c279" stroke="#111" stroke-width="2"></rect>
                <text x="210" y="195" text-anchor="middle" font-size="17" font-weight="900">（本）</text>
                <g id="previewLayer"></g>
                <g id="forceLayer"></g>
              </svg>
            </div>
            <p class="diagram-note">
              追加した力が、ここに矢印で表示されます。<br>
              すべての力を見つけて、自由物体図を完成させましょう。
            </p>
          </div>
        </section>
      </div>
    </main>

  </div>

  <script>
    const stage = {
      title: "机の上の本",
      target: "本",
      motion: "静止している（机の上に静止）",
      actors: [
        { id: "earth", label: "地球", correct: true, icon: "earth" },
        { id: "table", label: "机", correct: true, icon: "table" },
        { id: "air", label: "空気", correct: false, icon: "air", feedback: "今回は空気の影響は考えません。空気抵抗や浮力を扱わない設定です。" },
        { id: "velocity", label: "速度", correct: false, icon: "velocity", feedback: "速度は物体ではないので、力を及ぼす行為者にはなれません。" }
      ],
      directions: [
        { id: "up", label: "鉛直上向き", note: "（面に垂直上向き）", mark: "↑" },
        { id: "down", label: "鉛直下向き", note: "（重力の向き）", mark: "↓" },
        { id: "left", label: "水平方向左向き", note: "", mark: "←" },
        { id: "right", label: "水平方向右向き", note: "", mark: "→" }
      ],
      forceNames: ["重力", "垂直抗力", "摩擦力", "空気抵抗"],
      forces: [
        {
          actorId: "earth",
          directionId: "down",
          forceName: "重力",
          arrow: "down",
          directionFeedback: "地球が本を引く力は、鉛直下向きにはたらきます。",
          forceFeedback: "地球から本が受ける力は重力です。"
        },
        {
          actorId: "table",
          directionId: "up",
          forceName: "垂直抗力",
          arrow: "up",
          directionFeedback: "机が本を押す力は、接触面に垂直な上向きにはたらきます。",
          forceFeedback: "机から本への、面に垂直な力は垂直抗力です。摩擦力は接触面に沿う向きにはたらきます。"
        }
      ]
    };

    const state = {
      current: {
        actorId: null,
        directionId: null,
        directionCorrect: false,
        forceName: null
      },
      found: [],
      feedbackType: ""
    };

    const DEFAULT_FEEDBACK = "中央のカードを上から順に選んで、力を作りましょう。";

    const el = {
      actorGrid: document.getElementById("actorGrid"),
      directionGrid: document.getElementById("directionGrid"),
      forceGrid: document.getElementById("forceGrid"),
      stepsList: document.getElementById("stepsList"),
      currentActor: document.getElementById("currentActor"),
      currentDirection: document.getElementById("currentDirection"),
      currentForce: document.getElementById("currentForce"),
      currentTarget: document.getElementById("currentTarget"),
      targetText: document.getElementById("targetText"),
      motionText: document.getElementById("motionText"),
      stageTitle: document.getElementById("stageTitle"),
      foundCount: document.getElementById("foundCount"),
      feedback: document.getElementById("feedback"),
      addButton: document.getElementById("addButton"),
      clearDiagramButton: document.getElementById("clearDiagramButton"),
      forceLayer: document.getElementById("forceLayer"),
      previewLayer: document.getElementById("previewLayer")
    };

    function getActor(actorId) {
      return stage.actors.find((actor) => actor.id === actorId);
    }

    function getDirection(directionId) {
      return stage.directions.find((direction) => direction.id === directionId);
    }

    function getExpectedForce(actorId) {
      return stage.forces.find((force) => force.actorId === actorId);
    }

    function currentStep() {
      if (!state.current.actorId) return 2;
      if (!state.current.directionCorrect) return 3;
      if (!state.current.forceName) return 4;
      return 5;
    }

    function isReadyToAdd() {
      if (!state.current.actorId || !state.current.directionCorrect || !state.current.forceName) return false;
      const expected = getExpectedForce(state.current.actorId);
      return expected &&
        expected.directionId === state.current.directionId &&
        expected.forceName === state.current.forceName;
    }

    function setFeedback(message, type = "") {
      state.feedbackType = type;
      el.feedback.textContent = message;
      el.feedback.className = `feedback ${type}`;
    }

    function resetCurrent() {
      state.current.actorId = null;
      state.current.directionId = null;
      state.current.directionCorrect = false;
      state.current.forceName = null;
    }

    function fullReset() {
      resetCurrent();
      state.found = [];
      setFeedback(DEFAULT_FEEDBACK, "");
      render();
    }

    function renderActorIcon(type) {
      const icons = {
        earth: `
          <svg class="actor-icon" viewBox="0 0 80 80" aria-hidden="true">
            <circle cx="40" cy="40" r="33" fill="#8fd0ff" stroke="#111" stroke-width="2"></circle>
            <path d="M24 18 C31 20 31 28 26 30 C20 33 24 42 30 39 C36 36 42 43 36 50 C32 54 35 61 43 63 C50 65 53 55 49 50 C46 45 55 43 59 37 C65 28 55 20 47 22 C41 24 39 14 32 14 Z" fill="#67b96c" stroke="#155e27" stroke-width="1.5"></path>
            <path d="M16 44 C22 42 28 47 27 54 C26 59 20 58 17 53 Z" fill="#67b96c" stroke="#155e27" stroke-width="1.5"></path>
          </svg>`,
        table: `
          <svg class="actor-icon" viewBox="0 0 80 80" aria-hidden="true">
            <rect x="13" y="25" width="54" height="15" fill="#c7a16d" stroke="#111" stroke-width="2"></rect>
            <rect x="29" y="40" width="12" height="36" fill="#d8d8d8" stroke="#111" stroke-width="2"></rect>
          </svg>`,
        air: `
          <svg class="actor-icon" viewBox="0 0 80 80" aria-hidden="true">
            <path d="M28 52 H55 C64 52 68 45 65 38 C62 30 53 29 49 34 C47 23 34 20 28 29 C20 29 14 36 16 44 C18 49 22 52 28 52 Z" fill="#fff" stroke="#111" stroke-width="2.3"></path>
            <circle cx="62" cy="56" r="8" fill="#fff" stroke="#111" stroke-width="2"></circle>
          </svg>`,
        velocity: `
          <svg class="actor-icon" viewBox="0 0 80 80" aria-hidden="true">
            <line x1="13" y1="40" x2="62" y2="40" stroke="#1467bd" stroke-width="6"></line>
            <path d="M62 40 L48 28 V52 Z" fill="#1467bd"></path>
          </svg>`
      };
      return icons[type];
    }

    function renderActors() {
      el.actorGrid.innerHTML = "";
      stage.actors.forEach((actor) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "actor-card";
        if (state.current.actorId === actor.id) button.classList.add("selected");
        if (state.found.some((force) => force.actorId === actor.id)) button.classList.add("found");
        button.dataset.actorId = actor.id;
        button.innerHTML = `${renderActorIcon(actor.icon)}<span>${actor.label}</span>`;
        button.addEventListener("click", () => selectActor(actor.id));
        el.actorGrid.appendChild(button);
      });
    }

    function renderDirections() {
      el.directionGrid.innerHTML = "";
      stage.directions.forEach((direction) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-card";
        if (state.current.directionId === direction.id) button.classList.add("selected");
        button.disabled = !state.current.actorId;
        button.innerHTML = `<span class="arrow-mark">${direction.mark}</span><span class="choice-text">${direction.label}<span class="choice-note">${direction.note}</span></span>`;
        button.addEventListener("click", () => selectDirection(direction.id));
        el.directionGrid.appendChild(button);
      });
    }

    function renderForceNames() {
      el.forceGrid.innerHTML = "";
      stage.forceNames.forEach((forceName) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-card";
        if (state.current.forceName === forceName) button.classList.add("selected");
        button.disabled = !state.current.directionCorrect;
        button.textContent = forceName;
        button.addEventListener("click", () => selectForceName(forceName));
        el.forceGrid.appendChild(button);
      });
    }

    function renderSteps() {
      const steps = [
        { num: 1, text: "着目物体を確認する", suffix: "→ 本" },
        { num: 2, text: "行為者を探す（クリック）", suffix: "" },
        { num: 3, text: "向きカードを選ぶ", suffix: "" },
        { num: 4, text: "力の名前カードを選ぶ", suffix: "" },
        { num: 5, text: "自由物体図に追加する", suffix: "" }
      ];
      el.stepsList.innerHTML = "";
      const active = currentStep();
      steps.forEach((step) => {
        const li = document.createElement("li");
        li.className = `step ${step.num === active ? "active" : ""}`;
        li.innerHTML = `<span class="step-marker">${step.num === active ? "▶" : ""}</span><span class="step-num">${step.num}</span><span>${step.text}</span><span class="step-target">${step.suffix}</span>`;
        el.stepsList.appendChild(li);
      });
    }

    function renderCurrent() {
      const actor = getActor(state.current.actorId);
      const direction = getDirection(state.current.directionId);
      el.currentActor.textContent = actor ? actor.label : "未選択";
      el.currentTarget.textContent = stage.target;
      el.currentDirection.textContent = direction ? direction.label : "未選択";
      el.currentForce.textContent = state.current.forceName || "未選択";
      el.addButton.disabled = !isReadyToAdd();
    }

    function arrowCoords(arrow) {
      if (arrow === "up") return { x1: 210, y1: 125, x2: 210, y2: 62, labelX: 224, labelY: 84 };
      return { x1: 210, y1: 163, x2: 210, y2: 224, labelX: 224, labelY: 216 };
    }

    function drawArrow(layer, force, className, label) {
      const pos = arrowCoords(force.arrow);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", pos.x1);
      line.setAttribute("y1", pos.y1);
      line.setAttribute("x2", pos.x2);
      line.setAttribute("y2", pos.y2);
      line.setAttribute("class", className);
      layer.appendChild(line);

      if (label) {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", pos.labelX);
        text.setAttribute("y", pos.labelY);
        text.setAttribute("class", "force-label");
        text.textContent = label;
        layer.appendChild(text);
      }
    }

    function renderDiagram() {
      el.forceLayer.innerHTML = "";
      el.previewLayer.innerHTML = "";
      state.found.forEach((force) => drawArrow(el.forceLayer, force, "force-arrow", force.forceName));

      if (state.current.directionCorrect && state.current.forceName) return;
      if (state.current.directionCorrect) {
        const expected = getExpectedForce(state.current.actorId);
        if (expected && !state.found.some((force) => force.actorId === expected.actorId)) {
          drawArrow(el.previewLayer, expected, "preview-arrow", "");
        }
      }
    }

    function renderStatus() {
      el.targetText.textContent = stage.target;
      el.motionText.textContent = stage.motion;
      el.stageTitle.textContent = stage.title;
      el.foundCount.textContent = state.found.length;
    }

    function render() {
      renderActors();
      renderDirections();
      renderForceNames();
      renderSteps();
      renderCurrent();
      renderDiagram();
      renderStatus();
    }

    function selectActor(actorId) {
      const actor = getActor(actorId);
      if (!actor.correct) {
        setFeedback(actor.feedback, "error");
        return;
      }

      state.current.actorId = actorId;
      state.current.directionId = null;
      state.current.directionCorrect = false;
      state.current.forceName = null;

      if (state.found.some((force) => force.actorId === actorId)) {
        setFeedback("その行為者からの力は、すでに自由物体図に追加されています。", "error");
      } else {
        setFeedback(`行為者「${actor.label}」を選びました。次に向きを選びましょう。`);
      }
      render();
    }

    function selectDirection(directionId) {
      if (!state.current.actorId) return;

      const expected = getExpectedForce(state.current.actorId);
      const direction = getDirection(directionId);
      state.current.directionId = directionId;
      state.current.directionCorrect = expected && expected.directionId === directionId;
      state.current.forceName = null;

      if (state.current.directionCorrect) {
        setFeedback(`向き「${direction.label}」を選びました。次に力の名前を選びましょう。`);
      } else {
        setFeedback(expected.directionFeedback, "error");
      }
      render();
    }

    function selectForceName(forceName) {
      if (!state.current.directionCorrect) return;

      const expected = getExpectedForce(state.current.actorId);
      if (expected.forceName === forceName) {
        state.current.forceName = forceName;
        setFeedback(`力の名前「${forceName}」を選びました。自由物体図に追加できます。`);
      } else {
        state.current.forceName = null;
        setFeedback(expected.forceFeedback, "error");
      }
      render();
    }

    function addCurrentForce() {
      if (!isReadyToAdd()) return;

      const expected = getExpectedForce(state.current.actorId);
      const duplicate = state.found.some((force) =>
        force.actorId === expected.actorId &&
        force.directionId === expected.directionId &&
        force.forceName === expected.forceName
      );

      if (duplicate) {
        setFeedback("その力はすでに自由物体図に追加されています。", "error");
        return;
      }

      state.found.push({ ...expected });
      resetCurrent();

      if (state.found.length === stage.forces.length) {
        setFeedback("完成！本にはたらく力をすべて見つけました。", "success");
      } else {
        setFeedback("自由物体図に追加しました。もう一つの力を探しましょう。", "success");
      }
      render();
    }

    function clearDiagramOnly() {
      state.found = [];
      resetCurrent();
      setFeedback("自由物体図をクリアしました。もう一度、力を探しましょう。");
      render();
    }

    function showHint() {
      if (!state.current.actorId) {
        setFeedback("力を探すときは、まず「誰がこの物体に力を及ぼしているか」を考えます。");
      } else if (!state.current.directionCorrect) {
        setFeedback("接触している場合は、接触面の向きに注目しましょう。");
      } else if (!state.current.forceName) {
        setFeedback("地球から受ける力は重力、面に垂直な接触力は垂直抗力です。");
      } else {
        setFeedback("ここまでそろったら、自由物体図に追加して矢印として記録しましょう。");
      }
    }

    el.addButton.addEventListener("click", addCurrentForce);
    el.clearDiagramButton.addEventListener("click", clearDiagramOnly);

    render();
  </script>
</body>
</html>
