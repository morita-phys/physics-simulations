<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>力探しゲーム</title>
  <style>
    :root {
      --blue: #1467bd;
      --blue-dark: #0c4f96;
      --green: #248a32;
      --green-soft: #eaf7ec;
      --red: #cf2d22;
      --red-soft: #fff0ee;
      --ink: #111827;
      --muted: #667085;
      --line: #c9d3df;
      --panel: #ffffff;
      --soft: #f5f8fb;
      --disabled: #e8edf3;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #f3f6fa;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      height: 100vh;
      max-width: 100vw;
      padding: 10px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 3vw, 42px);
      line-height: 1;
      letter-spacing: 0;
    }

    .top-status {
      display: grid;
      grid-template-columns: auto auto minmax(200px, 1fr);
      align-items: stretch;
      gap: 8px;
      min-width: 0;
    }

    .status-chip,
    .feedback {
      min-height: 44px;
      padding: 7px 10px;
      border: 2px solid #a9c1df;
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .status-chip {
      white-space: nowrap;
    }

    .feedback {
      border-color: var(--blue);
      color: var(--blue-dark);
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .utility-button {
      min-height: 44px;
      padding: 7px 13px;
      border: 1.5px solid #8fa1b7;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .utility-button:hover {
      background: #eef5fc;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(390px, 1.25fr) minmax(310px, 0.95fr) minmax(350px, 1.05fr);
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      position: relative;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-blue {
      border-color: var(--blue);
    }

    .panel-green {
      border-color: var(--green);
      background: linear-gradient(180deg, #fff, #fbfffb);
    }

    .panel-red {
      border-color: var(--red);
    }

    .panel-title {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      margin: 8px 10px 0;
      padding: 5px 12px;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.1;
    }

    .title-blue {
      background: var(--blue);
    }

    .title-green {
      background: var(--green);
    }

    .title-red {
      background: var(--red);
    }

    .title-amber {
      background: #b76500;
    }

    .panel-body {
      padding: 10px 12px;
    }

    .instruction {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 900;
    }

    .info-box {
      width: min(100%, 520px);
      margin: 0 auto 8px;
      padding: 7px 12px;
      border: 1.5px solid var(--blue);
      border-radius: 8px;
      background: #f8fbff;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.5;
    }

    .scene-wrap {
      display: flex;
      justify-content: center;
      margin: 0 auto 6px;
    }

    .scene-svg {
      width: 100%;
      max-height: 190px;
    }

    .target-object {
      cursor: pointer;
    }

    .target-object .target-shape {
      transition: stroke 0.15s ease, stroke-width 0.15s ease, filter 0.15s ease;
    }

    .target-object:hover .target-shape,
    .target-object:focus .target-shape {
      stroke: #e38b00;
      stroke-width: 4;
    }

    .target-object.selected .target-shape {
      stroke: #f59e0b;
      stroke-width: 5;
      filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.55));
    }

    .fbd-svg {
      width: 100%;
      max-height: 255px;
    }

    svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .actor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0;
    }

    .actor-card {
      display: grid;
      place-items: center;
      gap: 3px;
      min-height: 78px;
      padding: 5px 6px;
      border: 2px solid var(--blue);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-weight: 900;
      font-size: 16px;
    }

    .actor-card:nth-child(2) {
      border-color: var(--green);
    }

    .actor-card:nth-child(3) {
      border-color: #8a3fc1;
    }

    .actor-card:nth-child(4) {
      border-color: #d97706;
    }

    .actor-card:not(:disabled):hover,
    .choice-card:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
    }

    .actor-card:disabled {
      background: var(--disabled);
      color: #8792a2;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .actor-card.selected,
    .choice-card.selected {
      outline: 3px solid #ffbf3f;
      outline-offset: 2px;
    }

    .actor-card.found {
      background: #f0f9f1;
      border-style: dashed;
    }

    .actor-icon {
      width: 42px;
      height: 42px;
    }

    .middle-column {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 8px;
      min-height: 0;
    }

    .steps-block {
      margin-top: 2px;
      padding-top: 2px;
    }

    .steps {
      list-style: none;
      margin: 0;
      padding: 0 4px;
      display: grid;
      gap: 5px;
      font-size: 14px;
      font-weight: 800;
    }

    .step {
      display: grid;
      grid-template-columns: 22px 34px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .step-marker {
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
    }

    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #fff;
      background: #86b78a;
      font-weight: 900;
    }

    .step.active .step-num {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(36, 138, 50, 0.16);
    }

    .step-target {
      color: var(--ink);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .choice-grid.six-options .choice-card {
      min-height: 50px;
      font-size: 14px;
    }

    .choice-card {
      min-height: 56px;
      padding: 7px 8px;
      border: 1.5px solid #aeb9c8;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .choice-card:disabled {
      background: var(--disabled);
      color: #8792a2;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .arrow-mark {
      color: var(--blue);
      font-size: 31px;
      line-height: 1;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .direction-vector {
      width: 40px;
      height: 32px;
      flex: 0 0 auto;
      overflow: visible;
    }

    .choice-text {
      line-height: 1.45;
    }

    .choice-note {
      display: block;
      color: inherit;
      font-size: 14px;
      line-height: 1.35;
    }

    .right-column {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      min-height: 0;
    }

    .current-list {
      display: grid;
      gap: 6px;
      font-size: 16px;
      font-weight: 900;
    }

    .current-row {
      display: grid;
      grid-template-columns: 104px 1fr;
      align-items: baseline;
      gap: 8px;
    }

    .current-value {
      color: var(--blue);
    }

    .add-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(100%, 280px);
      margin: 10px auto 0;
      padding: 9px 14px;
      border: 1px solid #aeb9c8;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .add-button:disabled {
      background: #e7ebf0;
      color: #8c96a5;
      cursor: not-allowed;
    }

    .next-button {
      background: var(--green);
    }

    [hidden] {
      display: none !important;
    }

    .add-button .circle {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      display: grid;
      place-items: center;
      font-size: 19px;
      line-height: 1;
    }

    .diagram-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .feedback.error {
      color: #b42318;
      border-color: #d92d20;
      background: #fff7f5;
    }

    .feedback.success {
      color: var(--green);
      border-color: var(--green);
      background: var(--green-soft);
    }

    .screen-reader {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .force-arrow {
      stroke: var(--red);
      stroke-width: 5;
      marker-end: url(#arrowHead);
    }

    .preview-arrow {
      stroke: #e89a22;
      stroke-width: 4;
      stroke-dasharray: 8 7;
      marker-end: url(#previewHead);
    }

    .force-label {
      fill: var(--red);
      font-weight: 900;
      font-size: 18px;
    }

    .fbd-note {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
    }

    .axis-line {
      stroke: #9aa3ad;
      stroke-width: 2;
      stroke-dasharray: 8 6;
      marker-end: url(#axisHead);
    }

    .axis-label {
      fill: #667085;
      font-size: 18px;
      font-weight: 900;
    }

    @media (max-width: 1180px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
        padding: 12px;
        overflow: visible;
      }

      .main-grid {
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .middle-column,
      .right-column {
        grid-template-rows: auto;
      }

      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .top-status {
        grid-template-columns: auto auto minmax(220px, 1fr);
      }

      .top-actions {
        justify-content: flex-end;
      }
    }

    @media (min-width: 1181px) and (max-height: 700px) {
      .app {
        padding: 6px;
        gap: 6px;
      }

      .topbar,
      .top-status,
      .top-actions,
      .main-grid,
      .middle-column,
      .right-column {
        gap: 6px;
      }

      h1 {
        font-size: 30px;
      }

      .status-chip,
      .feedback,
      .utility-button {
        min-height: 36px;
        padding: 4px 8px;
        font-size: 14px;
      }

      .panel-title {
        min-height: 27px;
        margin: 5px 7px 0;
        padding: 3px 9px;
        font-size: 15px;
      }

      .panel-body {
        padding: 6px 8px;
      }

      .info-box {
        margin-bottom: 4px;
        padding: 4px 8px;
        font-size: 14px;
        line-height: 1.35;
      }

      .scene-svg {
        max-height: 154px;
      }

      .actor-grid,
      .choice-grid {
        gap: 6px;
      }

      .actor-card {
        min-height: 58px;
        padding: 2px 5px;
        font-size: 14px;
      }

      .actor-icon {
        width: 33px;
        height: 33px;
      }

      .choice-card {
        min-height: 43px;
        padding: 3px 5px;
        font-size: 14px;
      }

      .choice-grid.six-options .choice-card {
        min-height: 40px;
        font-size: 12px;
      }

      .direction-vector {
        width: 32px;
        height: 26px;
      }

      .arrow-mark {
        font-size: 27px;
      }

      .steps {
        gap: 2px;
        font-size: 13px;
      }

      .step {
        min-height: 24px;
      }

      .step-num {
        width: 23px;
        height: 23px;
      }

      .current-list {
        gap: 3px;
        font-size: 14px;
      }

      .current-row {
        grid-template-columns: 92px 1fr;
      }

      .add-button {
        margin-top: 6px;
        padding: 6px 10px;
      }

      .fbd-svg {
        max-height: 198px;
      }

      .fbd-note {
        font-size: 10px;
      }
    }

    @media (max-width: 620px) {
      .top-status {
        grid-template-columns: 1fr;
      }

      .actor-grid,
      .choice-grid {
        grid-template-columns: 1fr 1fr;
      }

      .current-row {
        grid-template-columns: 90px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>力探しゲーム</h1>
      <div class="top-status" aria-live="polite">
        <div class="status-chip">ステージ： <span id="stageNumber">1</span> / 5　<span id="stageTitle">机の上の本</span></div>
        <div class="status-chip">見つけた力の数： <span id="foundCount">0</span> / <span id="totalForceCount">2</span></div>
        <div class="feedback" id="feedback">状況図の着目物体をクリックしましょう。</div>
      </div>
      <div class="top-actions">
        <button class="utility-button" id="hintButton" type="button">ヒント</button>
        <button class="utility-button" id="resetButton" type="button">リセット</button>
      </div>
    </header>

    <main class="main-grid">
      <section class="panel panel-blue" aria-labelledby="scene-title">
        <div class="panel-title title-blue" id="scene-title">状況図（横から見た図）</div>
        <div class="panel-body">
          <div class="info-box">
            <div>着目物体： <span id="targetText">本</span></div>
            <div>運動の状態： <span id="motionText">静止している（机の上に静止）</span></div>
            <div id="conditionRow" hidden>条件： <span id="conditionText"></span></div>
          </div>

          <div class="scene-wrap" id="sceneWrap">
            <svg class="scene-svg" id="sceneSvg" viewBox="0 0 560 260" role="img">
              <title id="sceneSvgTitle">横から見た机の上の本</title>
              <g id="sceneLayer"></g>
            </svg>
          </div>

          <div class="steps-block">
            <div class="panel-title title-green" id="steps-title">手順</div>
            <div class="panel-body">
              <ol class="steps" id="stepsList"></ol>
            </div>
          </div>
        </div>
      </section>

      <div class="middle-column">
        <section class="panel panel-blue" aria-labelledby="actor-title">
          <div class="panel-title title-blue" id="actor-title">力の行為者カードを選ぼう</div>
          <div class="panel-body">
            <div class="actor-grid" id="actorGrid" aria-label="行為者候補"></div>
          </div>
        </section>

        <section class="panel" aria-labelledby="force-title" style="border-color:#b76500;">
          <div class="panel-title title-amber" id="force-title">力の名前カードを選ぼう</div>
          <div class="panel-body">
            <div class="choice-grid" id="forceGrid"></div>
          </div>
        </section>

        <section class="panel panel-blue" aria-labelledby="direction-title">
          <div class="panel-title title-blue" id="direction-title">向きカードを選ぼう</div>
          <div class="panel-body">
            <div class="choice-grid" id="directionGrid"></div>
          </div>
        </section>
      </div>

      <div class="right-column">
        <section class="panel panel-green" aria-labelledby="current-title">
          <div class="panel-title title-green" id="current-title">いま考えている力（作成中）</div>
          <div class="panel-body">
            <div class="current-list" aria-live="polite">
              <div class="current-row"><span>対象物体：</span><span id="currentTarget">本</span></div>
              <div class="current-row"><span>行為者：</span><span class="current-value" id="currentActor">未選択</span></div>
              <div class="current-row"><span>力の名前：</span><span class="current-value" id="currentForce">未選択</span></div>
              <div class="current-row"><span>向き：</span><span class="current-value" id="currentDirection">未選択</span></div>
            </div>
            <button class="add-button" id="addButton" type="button" disabled>
              自由物体図に追加 <span class="circle">→</span>
            </button>
            <button class="add-button next-button" id="nextButton" type="button" hidden>
              次のステージへ <span class="circle">→</span>
            </button>
            <button class="add-button next-button" id="restartButton" type="button" hidden>
              はじめから <span class="circle">↺</span>
            </button>
          </div>
        </section>

        <section class="panel panel-red" aria-labelledby="fbd-title">
          <div class="diagram-head">
            <div class="panel-title title-red" id="fbd-title">自由物体図（横から見た図）</div>
          </div>
          <div class="panel-body">
            <div class="scene-wrap">
              <svg class="fbd-svg" id="fbdSvg" viewBox="0 0 420 270" role="img" aria-label="本の自由物体図">
                <defs>
                  <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf2d22"></path>
                  </marker>
                  <marker id="previewHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e89a22"></path>
                  </marker>
                  <marker id="axisHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3ad"></path>
                  </marker>
                </defs>
                <g id="axisLayer"></g>
                <g id="bodyLayer"></g>
                <g id="previewLayer"></g>
                <g id="forceLayer"></g>
                <g id="centerLayer"></g>
              </svg>
            </div>
            <p class="fbd-note">※ このゲームでは、矢印の長さは力の大きさを表していません。</p>
          </div>
        </section>
      </div>
    </main>

  </div>

  <script>
    const BASIC_DIRECTIONS = [
      { id: "up", label: "鉛直上向き", dx: 0, dy: -1 },
      { id: "down", label: "鉛直下向き", dx: 0, dy: 1 },
      { id: "left", label: "水平方向左向き", dx: -1, dy: 0 },
      { id: "right", label: "水平方向右向き", dx: 1, dy: 0 }
    ];

    const SLOPE_DIRECTIONS = [
      { id: "up", label: "鉛直上向き", dx: 0, dy: -1 },
      { id: "down", label: "鉛直下向き", dx: 0, dy: 1 },
      { id: "slope-up", label: "斜面に沿って上向き", dx: 0.866, dy: -0.5 },
      { id: "slope-down", label: "斜面に沿って下向き", dx: -0.866, dy: 0.5 },
      { id: "normal-away", label: "斜面に垂直で、斜面から離れる向き", dx: -0.5, dy: -0.866 },
      { id: "normal-toward", label: "斜面に垂直で、斜面へ向かう向き", dx: 0.5, dy: 0.866 }
    ];

    const STANDARD_AXES = {
      x: { dx: 1, dy: 0 },
      y: { dx: 0, dy: -1 }
    };

    const SLOPE_AXES = {
      x: { dx: 0.866, dy: -0.5 },
      y: { dx: -0.5, dy: -0.866 }
    };

    function copyDirections(source) {
      return source.map(function (direction) {
        return Object.assign({}, direction);
      });
    }

    const stages = [
      {
        id: "stage1",
        title: "机の上の本",
        target: "本",
        motion: "静止している（机の上に静止）",
        condition: "",
        sceneType: "book-on-table",
        sceneLabel: "机の上に本が静止している横から見た図",
        actors: [
          { id: "earth", label: "地球", icon: "earth" },
          { id: "table", label: "机", icon: "table" },
          { id: "air", label: "空気", icon: "air", feedback: "今回は空気の影響は考えません。" },
          { id: "velocity", label: "速度", icon: "velocity", feedback: "速度は物体ではないので、力を及ぼす行為者にはなれません。" }
        ],
        directions: copyDirections(BASIC_DIRECTIONS),
        forceNames: ["重力", "垂直抗力", "摩擦力", "空気抵抗"],
        forces: [

    function getStage() {
      return stages[state.stageIndex];
    }

    function getActor(actorId) {
      return getStage().actors.find(function (actor) {
        return actor.id === actorId;
      });
    }

    function getDirection(directionId) {
      return getStage().directions.find(function (direction) {
        return direction.id === directionId;
      });
    }

    function isForceFound(forceId) {
      return state.foundForceIds.includes(forceId);
    }

    function getUnfoundForces(actorId) {
      return getStage().forces.filter(function (force) {
        return !isForceFound(force.id) && (!actorId || force.actorId === actorId);
      });
    }

    function getCurrentMatchingForce() {
      return getUnfoundForces(state.current.actorId).find(function (force) {
        return force.directionId === state.current.directionId &&
          force.forceName === state.current.forceName;
      });
    }

    function defaultFeedback() {
      return "状況図の着目物体をクリックしましょう。";
    }

    function currentStep() {
      if (!state.targetSelected) return 1;
      if (!state.current.actorId) return 2;
      if (!state.current.forceName) return 3;
      if (!state.current.directionCorrect) return 4;
      return 5;
    }

    function isReadyToAdd() {
      var matchingForce = getCurrentMatchingForce();
      return Boolean(
        state.targetSelected &&
        state.current.forceId &&
        !isForceFound(state.current.forceId) &&
        matchingForce &&
        matchingForce.id === state.current.forceId
      );
    }

    function setFeedback(message, type) {
      state.feedbackType = type || "";
      el.feedback.textContent = message;
      el.feedback.className = "feedback " + state.feedbackType;
    }

    function resetCurrent() {
      state.current.actorId = null;
      state.current.directionId = null;
      state.current.directionCorrect = false;
      state.current.forceName = null;
      state.current.forceId = null;
    }

    function resetStageState() {
      resetCurrent();
      state.targetSelected = false;
      state.foundForceIds = [];
      state.stageComplete = false;
      setFeedback(defaultFeedback(), "");
    }

    function renderScene() {
      var stage = getStage();
      var renderer = sceneRenderers[stage.sceneType];
      el.sceneLayer.innerHTML = renderer ? renderer(stage) : "";
      var targetObject = el.sceneLayer.querySelector(".target-object");
      if (targetObject) {
        targetObject.classList.toggle("selected", state.targetSelected);
        targetObject.setAttribute("aria-pressed", state.targetSelected ? "true" : "false");
        targetObject.addEventListener("click", selectTarget);
        targetObject.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectTarget();
          }
        });
      }
      el.sceneSvgTitle.textContent = stage.sceneLabel;
      el.sceneWrap.setAttribute("aria-label", stage.sceneLabel);
      el.sceneSvg.setAttribute("aria-label", stage.sceneLabel);
    }

    function renderActors() {
      var stage = getStage();
      el.actorGrid.innerHTML = "";
      stage.actors.forEach(function (actor) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "actor-card";
        button.disabled = !state.targetSelected || state.stageComplete;
        if (state.current.actorId === actor.id) button.classList.add("selected");
        var actorForces = stage.forces.filter(function (force) {
          return force.actorId === actor.id;
        });
        if (actorForces.length && actorForces.every(function (force) {
          return isForceFound(force.id);
        })) {
          button.classList.add("found");
        }
        button.dataset.actorId = actor.id;
        button.innerHTML = renderActorIcon(actor.icon) + "<span>" + actor.label + "</span>";
        button.addEventListener("click", function () {
          selectActor(actor.id);
        });
        el.actorGrid.appendChild(button);
      });
    }

    function renderDirectionMark(direction) {
      var magnitude = Math.hypot(direction.dx, direction.dy) || 1;
      var dx = direction.dx / magnitude;
      var dy = direction.dy / magnitude;
      var x1 = 24 - dx * 11;
      var y1 = 18 - dy * 11;
      var x2 = 24 + dx * 13;
      var y2 = 18 + dy * 13;
      var baseX = x2 - dx * 7;
      var baseY = y2 - dy * 7;
      var px = -dy * 4;
      var py = dx * 4;
      var points = x2 + "," + y2 + " " + (baseX + px) + "," + (baseY + py) + " " + (baseX - px) + "," + (baseY - py);
      return '<svg class="direction-vector" viewBox="0 0 48 36" aria-hidden="true"><line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#1467bd" stroke-width="3"></line><polygon points="' + points + '" fill="#1467bd"></polygon></svg>';
    }

    function renderDirections() {
      var stage = getStage();
      el.directionGrid.innerHTML = "";
      el.directionGrid.classList.toggle("six-options", stage.directions.length > 4);
      stage.directions.forEach(function (direction) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "choice-card";
        if (state.current.directionId === direction.id) button.classList.add("selected");
        button.disabled = !state.current.forceId || state.stageComplete;
        button.innerHTML = renderDirectionMark(direction) + '<span class="choice-text">' + direction.label + "</span>";
        button.addEventListener("click", function () {
          selectDirection(direction.id);
        });
        el.directionGrid.appendChild(button);
      });
    }

    function renderForceNames() {
      var stage = getStage();
      el.forceGrid.innerHTML = "";
      stage.forceNames.forEach(function (forceName) {

        button.type = "button";
        button.className = "choice-card";
        if (state.current.forceName === forceName) button.classList.add("selected");
        button.disabled = !state.current.actorId || state.stageComplete;
        button.textContent = forceName;
        button.addEventListener("click", function () {
          selectForceName(forceName);
        });
        el.forceGrid.appendChild(button);
      });
    }

        { num: 3, text: "力の名前を選ぶ" },
        { num: 4, text: "力の向きを考える" },
        { num: 5, text: "自由物体図に追加する" }
      ];
      el.stepsList.innerHTML = "";
      var active = currentStep();
      steps.forEach(function (step) {
        var item = document.createElement("li");
        item.className = "step " + (step.num === active && !state.stageComplete ? "active" : "");
        item.innerHTML = '<span class="step-marker">' + (step.num === active && !state.stageComplete ? "▶" : "") + '</span><span class="step-num">' + step.num + "</span><span>" + step.text + "</span>";
        el.stepsList.appendChild(item);
      });
    }

    function renderCurrent() {
      var stage = getStage();
      var actor = getActor(state.current.actorId);
      var direction = getDirection(state.current.directionId);
      el.currentActor.textContent = actor ? actor.label : "未選択";
      el.currentTarget.textContent = state.targetSelected ? stage.target : "未選択";
      el.currentForce.textContent = state.current.forceName || "未選択";
      el.currentDirection.textContent = direction ? direction.label : "未選択";
      el.addButton.disabled = !isReadyToAdd();
      el.addButton.hidden = state.stageComplete;
      el.nextButton.hidden = !(state.stageComplete && state.stageIndex < stages.length - 1);
      el.restartButton.hidden = !(state.stageComplete && state.stageIndex === stages.length - 1);
    }

    function createSvgElement(name, attributes) {
      var element = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.keys(attributes || {}).forEach(function (key) {
        element.setAttribute(key, attributes[key]);
      });
      return element;
    }

    function renderAxes() {
      var axes = getStage().axes;
      el.axisLayer.innerHTML = "";
      ["x", "y"].forEach(function (name) {
        var vector = axes[name];
        var magnitude = Math.hypot(vector.dx, vector.dy) || 1;
        var dx = vector.dx / magnitude;
        var dy = vector.dy / magnitude;
        var line = createSvgElement("line", {
          x1: 210 - dx * 105,
          y1: 145 - dy * 105,
          x2: 210 + dx * 110,
          y2: 145 + dy * 110,
          class: "axis-line"
        });
        el.axisLayer.appendChild(line);
        var label = createSvgElement("text", {
          x: 210 + dx * 126,
          y: 145 + dy * 126 + 6,
          class: "axis-label",
          "text-anchor": "middle"
        });
        label.textContent = name;
        el.axisLayer.appendChild(label);
      });
    }

    function renderFbdBody() {
      var body = getStage().fbd;
      el.bodyLayer.innerHTML = "";
      if (body.shape === "circle") {
        var circle = createSvgElement("circle", {
          cx: 210,
          cy: 145,
          r: 31,
          fill: body.fill,
          stroke: "#111",
          "stroke-width": 2
        });
        el.bodyLayer.appendChild(circle);
        var circleLabel = createSvgElement("text", {
          x: 170,
          y: 151,
          "text-anchor": "end",
          "font-size": 14,
          "font-weight": 900
        });
        circleLabel.textContent = body.label;
        el.bodyLayer.appendChild(circleLabel);
      } else {
        var group = createSvgElement("g", {
          transform: "rotate(" + (body.angle || 0) + " 210 145)"
        });
        var rect = createSvgElement("rect", {
          x: 150,
          y: 125,
          width: 120,
          height: 40,
          fill: body.fill,
          stroke: "#111",
          "stroke-width": 2
        });
        var rectLabel = createSvgElement("text", {
          x: 166,
          y: 151,
          "text-anchor": "middle",
          "font-size": 14,
          "font-weight": 900
        });
        rectLabel.textContent = body.label;
        group.appendChild(rect);
        group.appendChild(rectLabel);
        el.bodyLayer.appendChild(group);
      }
      el.centerLayer.innerHTML = "";
      el.centerLayer.appendChild(createSvgElement("circle", {
        cx: 210,
        cy: 145,
        r: 5.5,
        fill: "#111"
      }));
    }

    function drawForceArrow(layer, directionId, className, labelText) {
      var direction = getDirection(directionId);
      if (!direction) return;
      var magnitude = Math.hypot(direction.dx, direction.dy) || 1;
      var dx = direction.dx / magnitude;
      var dy = direction.dy / magnitude;
      var x2 = 210 + dx * 94;
      var y2 = 145 + dy * 94;
      var line = createSvgElement("line", {
        x1: 210,
        y1: 145,
        x2: x2,
        y2: y2,
        class: className
      });
      layer.appendChild(line);
      if (labelText) {
        var pointsLeft = dx < -0.2;
        var text = createSvgElement("text", {
          x: x2 + (pointsLeft ? -10 : 10),
          y: y2 + (dy < -0.2 ? 18 : -8),
          class: "force-label",
          "text-anchor": pointsLeft ? "end" : "start"
        });
        text.textContent = labelText;
        layer.appendChild(text);
      }
    }

    function renderDiagram() {
      var stage = getStage();
      renderAxes();
      el.bodyLayer.innerHTML = "";
      el.centerLayer.innerHTML = "";
      el.forceLayer.innerHTML = "";
      el.previewLayer.innerHTML = "";
      if (!state.targetSelected) {
        el.fbdSvg.setAttribute("aria-label", "着目物体を選ぶ前の自由物体図");
        return;
      }
      renderFbdBody();
      stage.forces.filter(function (force) {
        return isForceFound(force.id);
      }).forEach(function (force) {
        drawForceArrow(el.forceLayer, force.directionId, "force-arrow", force.forceName);
      });
      if (state.current.directionId) {
        drawForceArrow(el.previewLayer, state.current.directionId, "preview-arrow", "");
      }
      el.fbdSvg.setAttribute("aria-label", stage.target + "の自由物体図");
    }

    function renderStatus() {
      var stage = getStage();
      el.targetText.textContent = stage.target;
      el.motionText.textContent = stage.motion;
      el.conditionText.textContent = stage.condition || "";
      el.conditionRow.hidden = !stage.condition;
      el.stageNumber.textContent = state.stageIndex + 1;
      el.stageTitle.textContent = stage.title;
      el.foundCount.textContent = state.foundForceIds.length;
      el.totalForceCount.textContent = stage.forces.length;
    }

    function render() {
      renderScene();
      renderActors();
      renderForceNames();
      renderDirections();
      renderSteps();
      renderCurrent();
      renderDiagram();
      renderStatus();
    }

    function selectTarget() {
      if (state.stageComplete || state.targetSelected) return;
      var stage = getStage();
      state.targetSelected = true;
      resetCurrent();
      setFeedback("着目物体「" + stage.target + "」を選びました。次に力の行為者を探しましょう。");
      render();
    }

    function selectActor(actorId) {
      if (!state.targetSelected || state.stageComplete) return;
      var stage = getStage();
      var actor = getActor(actorId);
      var actorForces = stage.forces.filter(function (force) {
        return force.actorId === actorId;
      });
      if (!actorForces.length) {
        setFeedback(actor.feedback || "その候補は、力を及ぼす行為者ではありません。", "error");
        return;
      }
      if (getUnfoundForces(actorId).length === 0) {
        resetCurrent();
        setFeedback("その行為者から受ける力は、すべて追加されています。", "error");
        render();
        return;
      }
      state.current.actorId = actorId;
      state.current.directionId = null;
      state.current.directionCorrect = false;
      state.current.forceName = null;
      state.current.forceId = null;
      setFeedback("行為者「" + actor.label + "」を選びました。次に力の名前を考えましょう。");
      render();
    }

    function selectDirection(directionId) {
      if (!state.current.forceId || state.stageComplete) return;
      var stage = getStage();
      var direction = getDirection(directionId);
      state.current.directionId = directionId;
      var selectedForce = stage.forces.find(function (force) {
        return force.id === state.current.forceId;
      });
      state.current.directionCorrect = Boolean(selectedForce && selectedForce.directionId === directionId);

      if (state.current.directionCorrect) {
        setFeedback("向き「" + direction.label + "」を選びました。自由物体図に追加できます。");
      } else {
        setFeedback(selectedForce && selectedForce.directionFeedback ? selectedForce.directionFeedback : "行為者と着目物体の接触や位置関係に注目して、向きを考え直してみよう。", "error");
      }
      render();
    }

    function selectForceName(forceName) {
      if (!state.current.actorId || state.stageComplete) return;
      state.current.forceName = forceName;
      state.current.directionId = null;
      state.current.directionCorrect = false;
      var matchingForce = getUnfoundForces(state.current.actorId).find(function (force) {
        return force.forceName === forceName;
      });
      if (matchingForce) {
        state.current.forceId = matchingForce.id;
        setFeedback("力の名前「" + forceName + "」を選びました。次に向きを考えましょう。");
      } else {
        var alreadyFound = getStage().forces.some(function (force) {
          return force.actorId === state.current.actorId &&
            force.forceName === forceName &&
            isForceFound(force.id);
        });
        state.current.forceName = null;
        state.current.forceId = null;
        if (alreadyFound && getUnfoundForces(state.current.actorId).length) {
          setFeedback("その力はすでに見つけています。同じ行為者から受ける別の力を探してみよう。", "error");
        } else {
          setFeedback("選んだ行為者が対象物体に及ぼす力の名前を考え直してみよう。", "error");
        }
      }
      render();
    }

    function addCurrentForce() {
      if (!isReadyToAdd() || state.stageComplete) return;
      var stage = getStage();
      var force = stage.forces.find(function (item) {
        return item.id === state.current.forceId;
      });
      if (!force || isForceFound(force.id)) {
        setFeedback("その力はすでに自由物体図に追加されています。", "error");
        return;
      }
      state.foundForceIds.push(force.id);
      resetCurrent();

      if (state.foundForceIds.length === stage.forces.length) {
        state.stageComplete = true;
        if (state.stageIndex === stages.length - 1) {
          setFeedback("✓ 全ステージクリア！", "success");
        } else {
          setFeedback("完成！" + stage.target + "にはたらく力をすべて見つけました。", "success");
        }
      } else {
        setFeedback("自由物体図に追加しました。別の力を探しましょう。", "success");
      }
      render();
    }

    function goToNextStage() {
      if (!state.stageComplete || state.stageIndex >= stages.length - 1) return;
      state.stageIndex += 1;
      resetStageState();
      render();
    }

    function restartGame() {
      if (!state.stageComplete || state.stageIndex !== stages.length - 1) return;
      state.stageIndex = 0;
      resetStageState();
      render();
    }

    function showHint() {
      if (state.stageComplete) {
        if (state.stageIndex < stages.length - 1) {
          setFeedback("次のステージへ進みましょう。", "success");
        } else {
          setFeedback("✓ 全ステージクリア！", "success");
        }
      } else if (!state.targetSelected) {
        setFeedback("状況図で、課題に指定された着目物体をクリックしよう。");
      } else if (!state.current.actorId) {
        setFeedback("着目物体の周囲にあるものを見て、力を及ぼしている相手を探そう。");
      } else if (!state.current.forceName) {
        setFeedback("選んだ行為者が対象物体に及ぼす力の名前を考えよう。");
      } else if (!state.current.directionCorrect) {
        setFeedback("選んだ力がどちら向きにはたらくか、位置関係や接触面に注目しよう。");
      } else {
        setFeedback("選んだ内容を自由物体図に記録しよう。");
      }
    }

    el.addButton.addEventListener("click", addCurrentForce);
    el.nextButton.addEventListener("click", goToNextStage);
    el.restartButton.addEventListener("click", restartGame);
    el.hintButton.addEventListener("click", showHint);
    el.resetButton.addEventListener("click", fullReset);

    render();
  </script>
</body>
</html>
