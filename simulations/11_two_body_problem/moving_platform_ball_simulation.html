<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動く台の上の小球の運動シミュレーション</title>
  <style>
    :root {
      --blue: #1f6feb;
      --blue-dark: #0b49b7;
      --blue-soft: #eaf4ff;
      --red: #f00808;
      --green: #0aa13a;
      --line: #bcd8fa;
      --text: #111;
      --muted: #5e6a76;
      --panel: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      background: linear-gradient(180deg, #eff7ff 0%, #ffffff 46%, #f2f8ff 100%);
    }

    .app {
      min-height: 100vh;
      border: 1px solid #9bc8fb;
      background: rgba(255, 255, 255, 0.64);
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      justify-content: space-between;
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(238, 247, 255, 0.96), rgba(255, 255, 255, 0.96));
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 36px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .view-label {
      min-width: 330px;
      padding: 13px 22px;
      border: 1px solid #21b84f;
      border-radius: 6px;
      color: var(--green);
      background: #fbfffc;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 1px 6px rgba(38, 114, 65, 0.08);
    }

    button {
      border: 1px solid #b9c0c8;
      border-radius: 6px;
      background: linear-gradient(#ffffff, #f6f6f6);
      color: #111;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    button:active {
      transform: translateY(1px);
    }

    .switch-button {
      padding: 13px 26px;
      font-size: 18px;
    }

    .switch-button .icon {
      font-size: 27px;
      vertical-align: -3px;
      margin-right: 12px;
    }

    main {
      padding: 14px;
    }

    .stage-wrap {
      width: 100%;
      height: min(48vh, 540px);
      min-height: 360px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #ffffff 58%, #f8fbff 100%);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .bottom {
      display: grid;
      grid-template-columns: 1fr 1fr 0.8fr;
      gap: 18px;
      margin-top: 16px;
      align-items: stretch;
    }

    .panel {
      min-height: 268px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      padding: 18px 26px;
      box-shadow: 0 10px 28px rgba(111, 154, 204, 0.08) inset;
    }

    .panel h2 {
      margin: 0 0 22px;
      color: var(--blue-dark);
      font-size: 21px;
      line-height: 1.2;
      font-weight: 900;
    }

    .param-grid {
      display: grid;
      gap: 18px;
    }

    .param-row {
      display: grid;
      grid-template-columns: 132px minmax(110px, 1fr) 76px 48px;
      gap: 14px;
      align-items: center;
      font-size: 17px;
      font-weight: 700;
    }

    .symbol {
      display: inline-block;
      min-width: 30px;
      margin-left: 10px;
      font-style: italic;
      font-weight: 900;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2d82f3;
    }

    input[type="number"] {
      width: 76px;
      padding: 8px 6px;
      border: 1px solid #c7cdd3;
      border-radius: 6px;
      font-size: 17px;
      text-align: center;
      background: white;
    }

    .transport {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .transport button {
      min-height: 70px;
      font-size: 19px;
    }

    .transport .play {
      border-color: #0c70ee;
      color: white;
      background: linear-gradient(180deg, #2584ff, #0f68df);
    }

    .transport .pause .mark {
      font-size: 28px;
      vertical-align: -3px;
      margin-right: 7px;
    }

    .transport .reset {
      color: #111;
    }

    .transport .reset .mark {
      color: #ff0808;
      font-size: 28px;
      vertical-align: -4px;
      margin-right: 7px;
    }

    .readout {
      display: grid;
      gap: 20px;
      font-size: 18px;
      font-weight: 800;
    }

    .speed-row {
      display: grid;
      grid-template-columns: 190px 64px 1fr;
      gap: 10px;
      align-items: center;
    }

    .blue { color: var(--blue); }
    .red { color: var(--red); }
    .green { color: var(--green); }

    .arrow {
      display: inline-block;
      width: 48px;
      height: 3px;
      border-radius: 999px;
      background: currentColor;
      position: relative;
      vertical-align: middle;
    }

    .arrow::after {
      content: "";
      position: absolute;
      right: -1px;
      top: 50%;
      width: 0;
      height: 0;
      border-left: 12px solid currentColor;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      transform: translateY(-50%);
    }

    .value {
      color: #111;
      font-weight: 700;
      white-space: nowrap;
    }

    .divider {
      border-top: 2px dashed #b8bdc3;
      margin: 2px 0 8px;
    }

    .apex-note {
      display: none;
      margin-top: -6px;
      color: var(--green);
      font-size: 16px;
      font-weight: 900;
    }

    .apex-note.show {
      display: block;
    }

    .options {
      display: grid;
      gap: 23px;
      font-size: 19px;
      font-weight: 800;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: #2d82f3;
    }

    @media (max-width: 1040px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        justify-content: space-between;
      }

      .bottom {
        grid-template-columns: 1fr;
      }

      .stage-wrap {
        min-height: 340px;
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 16px;
      }

      main {
        padding: 10px;
      }

      .view-label {
        min-width: 0;
        width: 100%;
      }

      .switch-button {
        width: 100%;
      }

      .param-row {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      input[type="number"] {
        width: 100%;
      }

      .transport {
        grid-template-columns: 1fr;
      }

      .speed-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>動く台の上の小球の運動シミュレーション</h1>
      <div class="top-actions">
        <div class="view-label" id="viewLabel">観測者の視点：地面から見た視点</div>
        <button class="switch-button" id="toggleView" type="button"><span class="icon">↔</span>視点を切り替え</button>
      </div>
    </header>

    <main>
      <section class="stage-wrap" aria-label="シミュレーション表示領域">
        <canvas id="stage"></canvas>
      </section>

      <section class="bottom" aria-label="操作と情報">
        <div>
          <div class="panel">
            <h2>パラメータ</h2>
            <div class="param-grid">
              <label class="param-row">
                <span>初速度 <span class="symbol">v<sub>0</sub></span></span>
                <input id="v0Range" type="range" min="2" max="6" step="0.1" value="4">
                <input id="v0Number" type="number" min="2" max="6" step="0.1" value="4.00">
                <span>m/s</span>
              </label>

              <label class="param-row">
                <span>小球の質量 <span class="symbol">m</span></span>
                <input id="mRange" type="range" min="0.5" max="3" step="0.1" value="1">
                <input id="mNumber" type="number" min="0.5" max="3" step="0.1" value="1.00">
                <span>kg</span>
              </label>

              <label class="param-row">
                <span>台の質量 <span class="symbol">M</span></span>
                <input id="MRange" type="range" min="0.8" max="8" step="0.1" value="2">
                <input id="MNumber" type="number" min="0.8" max="8" step="0.1" value="2.00">
                <span>kg</span>
              </label>
            </div>
          </div>

          <div class="transport">
            <button class="play" id="playButton" type="button">▶　再生</button>
            <button class="pause" id="pauseButton" type="button"><span class="mark">Ⅱ</span>一時停止</button>
            <button class="reset" id="resetButton" type="button"><span class="mark">↻</span>リセット</button>
          </div>
        </div>

        <div class="panel">
          <h2 id="speedTitle">速度の情報（地面からの速度）</h2>
          <div class="readout">
            <div class="speed-row blue">
              <span>小球の速度　v<sub>P</sub></span>
              <span class="arrow"></span>
              <span class="value" id="ballVelocity">(4.00, 0.00) m/s</span>
            </div>

            <div class="speed-row red">
              <span>台の速度　V</span>
              <span class="arrow"></span>
              <span class="value red" id="platformVelocity">(0.00, 0.00) m/s</span>
            </div>

            <div class="speed-row green">
              <span>相対速度　v<sub>rel</sub>=v<sub>P</sub>−V</span>
              <span class="arrow"></span>
              <span class="value" id="relativeVelocity">(4.00, 0.00) m/s</span>
            </div>

            <div class="apex-note" id="apexNote">最高点：相対速度 ≈ 0</div>
            <div class="divider"></div>

            <div class="speed-row">
              <span>相対速度の大きさ</span>
              <span>|v<sub>rel</sub>| =</span>
              <span class="value" id="relativeSpeed">4.00 m/s</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>表示オプション</h2>
          <div class="options">
            <label><input id="showVelocity" type="checkbox" checked>速度ベクトル</label>
            <label><input id="showForce" type="checkbox" checked>力ベクトル</label>
            <label><input id="showTrace" type="checkbox" checked>軌跡</label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");

    const controls = {
      v0: {
        range: document.getElementById("v0Range"),
        number: document.getElementById("v0Number"),
        min: 2,
        max: 6
      },
      m: {
        range: document.getElementById("mRange"),
        number: document.getElementById("mNumber"),
        min: 0.5,
        max: 3
      },
      M: {
        range: document.getElementById("MRange"),
        number: document.getElementById("MNumber"),
        min: 0.8,
        max: 8
      }
    };

    const readout = {
      title: document.getElementById("speedTitle"),
      ball: document.getElementById("ballVelocity"),
      platform: document.getElementById("platformVelocity"),
      relative: document.getElementById("relativeVelocity"),
      relativeSpeed: document.getElementById("relativeSpeed"),
      apexNote: document.getElementById("apexNote"),
      viewLabel: document.getElementById("viewLabel")
    };

    const options = {
      velocity: document.getElementById("showVelocity"),
      force: document.getElementById("showForce"),
      trace: document.getElementById("showTrace")
    };

    const model = {
      g: 9.8,
      platformStart: 0.82,
      flatEnd: 3.25,
      curveWidth: 1.45,
      bodyHeight: 0.34,
      ballRadius: 0.095,
      platformX: 0.82,
      q: 0.27,
      running: false,
      view: "ground",
      atApex: false,
      lastTime: performance.now(),
      traces: [],
      stroboClock: 0
    };

    function params() {
      return {
        v0: Number(controls.v0.number.value),
        m: Number(controls.m.number.value),
        M: Number(controls.M.number.value)
      };
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function format(value) {
      if (Math.abs(value) < 0.005) return "0.00";
      return value.toFixed(2);
    }

    function syncControl(name, source) {
      const control = controls[name];
      const value = clamp(Number(source.value), control.min, control.max);
      control.range.value = value;
      control.number.value = value.toFixed(2);
      resetSimulation(false);
    }

    Object.entries(controls).forEach(([name, control]) => {
      control.range.addEventListener("input", () => syncControl(name, control.range));
      control.number.addEventListener("change", () => syncControl(name, control.number));
    });

    document.getElementById("playButton").addEventListener("click", () => {
      model.running = true;
      model.lastTime = performance.now();
    });

    document.getElementById("pauseButton").addEventListener("click", () => {
      model.running = false;
    });

    document.getElementById("resetButton").addEventListener("click", () => resetSimulation(true));

    document.getElementById("toggleView").addEventListener("click", () => {
      model.view = model.view === "ground" ? "platform" : "ground";
      updateViewText();
      draw();
    });

    Object.values(options).forEach(option => {
      option.addEventListener("change", draw);
    });

    function resetSimulation(stop) {
      model.platformX = model.platformStart;
      model.q = 0.27;
      model.atApex = false;
      model.traces = [];
      model.stroboClock = 0;
      if (stop) model.running = false;
      model.lastTime = performance.now();
      updateReadout();
      draw();
    }

    function updateViewText() {
      const platformView = model.view === "platform";
      readout.viewLabel.textContent = platformView
        ? "観測者の視点：台とともに動く視点"
        : "観測者の視点：地面から見た視点";
      readout.title.textContent = platformView
        ? "速度の情報（台とともに動く視点）"
        : "速度の情報（地面からの速度）";
    }

    function curveHeight() {
      const { v0, m, M } = params();
      const commonVelocity = (m * v0) / (m + M);
      const initialEnergy = 0.5 * m * v0 * v0;
      const commonEnergy = 0.5 * (m + M) * commonVelocity * commonVelocity;
      return Math.max(0.22, (initialEnergy - commonEnergy) / (m * model.g));
    }

    function topQ() {
      return model.flatEnd + model.curveWidth;
    }

    function profile(q) {
      const h = curveHeight();
      if (q <= model.flatEnd) {
        return { x: q, y: 0, slope: 0, u: 0 };
      }
      const u = clamp((q - model.flatEnd) / model.curveWidth, 0, 1);
      const y = h * Math.pow(u, 2.35);
      const slope = h * 2.35 * Math.pow(Math.max(u, 0.0001), 1.35) / model.curveWidth;
      return { x: q, y, slope, u };
    }

    function solveMotion() {
      const { v0, m, M } = params();
      const p = profile(model.q);

      if (model.atApex) {
        const common = (m * v0) / (m + M);
        return {
          platformV: common,
          ballVx: common,
          ballVy: 0,
          relVx: 0,
          relVy: 0,
          qDot: 0,
          speedRel: 0,
          profile: profile(topQ())
        };
      }

      if (model.q < model.flatEnd) {
        return {
          platformV: 0,
          ballVx: v0,
          ballVy: 0,
          relVx: v0,
          relVy: 0,
          qDot: v0,
          speedRel: v0,
          profile: p
        };
      }

      const initialEnergy = 0.5 * m * v0 * v0;
      const energyFor = qDot => {
        const platformV = (m * (v0 - qDot)) / (m + M);
        const ballVx = platformV + qDot;
        const ballVy = p.slope * qDot;
        return 0.5 * M * platformV * platformV
          + 0.5 * m * (ballVx * ballVx + ballVy * ballVy)
          + m * model.g * p.y;
      };

      const topEnergy = energyFor(0);
      if (topEnergy >= initialEnergy - 0.002) {
        model.q = topQ();
        model.atApex = true;
        return solveMotion();
      }

      let low = 0;
      let high = v0 * 1.4;
      for (let i = 0; i < 36; i++) {
        const mid = (low + high) / 2;
        if (energyFor(mid) > initialEnergy) high = mid;
        else low = mid;
      }

      const qDot = low;
      const platformV = (m * (v0 - qDot)) / (m + M);
      const ballVx = platformV + qDot;
      const ballVy = p.slope * qDot;
      const relVx = qDot;
      const relVy = p.slope * qDot;
      return {
        platformV,
        ballVx,
        ballVy,
        relVx,
        relVy,
        qDot,
        speedRel: Math.hypot(relVx, relVy),
        profile: p
      };
    }

    function worldBall(motion = solveMotion()) {
      const p = motion.profile;
      const normal = normalVector(p.slope);
      return {
        x: model.platformX + p.x + normal.x * model.ballRadius,
        y: p.y + normal.y * model.ballRadius,
        normal,
        profile: p
      };
    }

    function normalVector(slope) {
      const length = Math.hypot(slope, 1);
      return { x: -slope / length, y: 1 / length };
    }

    function step(dt) {
      const motion = solveMotion();
      model.platformX += motion.platformV * dt;
      if (!model.atApex) {
        model.q += motion.qDot * dt;
        if (model.q >= topQ()) {
          model.q = topQ();
          model.atApex = true;
        }
      }

      model.stroboClock += dt;
      if (model.stroboClock >= 0.13) {
        model.stroboClock = 0;
        const current = solveMotion();
        const ball = worldBall(current);
        model.traces.push({
          ballX: ball.x,
          ballY: ball.y,
          platformX: model.platformX,
          centerX: (params().m * ball.x + params().M * (model.platformX + topQ() / 2)) / (params().m + params().M)
        });
        if (model.traces.length > 70) model.traces.shift();
      }
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    window.addEventListener("resize", resizeCanvas);

    function sceneMetrics() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const height = curveHeight();
      const sx = Math.min(170, Math.max(102, (w - 210) / 7.7));
      const sy = Math.min(170, Math.max(98, (h - 150) / (height + 0.92)));
      const scale = Math.min(sx, sy);
      const groundY = h - 58;
      const cameraX = model.view === "platform" ? model.platformX - model.platformStart : 0;
      return {
        w,
        h,
        scale,
        groundY,
        platformTopY: groundY - 72,
        cameraX,
        toScreenX: x => 52 + (x - cameraX) * scale,
        toScreenY: y => groundY - 72 - y * scale
      };
    }

    function draw() {
      if (!canvas.width || !canvas.height) return;
      const metrics = sceneMetrics();
      ctx.clearRect(0, 0, metrics.w, metrics.h);
      drawBackdrop(metrics);
      if (options.trace.checked) drawTrace(metrics);
      const motion = solveMotion();
      drawPlatform(metrics);
      drawBall(metrics, motion);
      if (options.velocity.checked) drawVelocityVectors(metrics, motion);
      if (options.force.checked) drawForceVectors(metrics, motion);
      drawApexMark(metrics);
      updateReadout(motion);
    }

    function drawBackdrop(metrics) {
      ctx.save();
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(metrics.toScreenX(0.08), metrics.groundY);
      ctx.lineTo(metrics.toScreenX(6.95), metrics.groundY);
      ctx.stroke();
      ctx.restore();
    }

    function drawPlatform(metrics) {
      const left = model.platformX;
      const bottom = -model.bodyHeight;
      const right = topQ();

      const topPoints = [];
      topPoints.push({ x: 0, y: 0 });
      topPoints.push({ x: model.flatEnd, y: 0 });
      for (let i = 1; i <= 36; i++) {
        const q = model.flatEnd + model.curveWidth * (i / 36);
        const p = profile(q);
        topPoints.push({ x: p.x, y: p.y });
      }

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(metrics.toScreenX(left), metrics.toScreenY(0));
      topPoints.slice(1).forEach(point => {
        ctx.lineTo(metrics.toScreenX(left + point.x), metrics.toScreenY(point.y));
      });
      ctx.lineTo(metrics.toScreenX(left + right), metrics.toScreenY(bottom));
      ctx.lineTo(metrics.toScreenX(left), metrics.toScreenY(bottom));
      ctx.closePath();

      const gradient = ctx.createLinearGradient(0, metrics.toScreenY(0), 0, metrics.toScreenY(bottom));
      gradient.addColorStop(0, "#f7f7f7");
      gradient.addColorStop(1, "#d2d2d2");
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#111";
      ctx.font = "700 16px Meiryo, sans-serif";
      ctx.textAlign = "center";
      const labelX = metrics.toScreenX(left + 2.02);
      const labelY = metrics.toScreenY(bottom + 0.15);
      ctx.fillText(`台（質量 M = ${params().M.toFixed(2)} kg）`, labelX, labelY);

      drawWheel(metrics, left + 0.34, bottom - 0.11);
      drawWheel(metrics, left + right - 0.34, bottom - 0.11);
      ctx.restore();
    }

    function drawWheel(metrics, x, y) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(metrics.toScreenX(x), metrics.toScreenY(y), 13, 0, Math.PI * 2);
      ctx.fillStyle = "#d8d8d8";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#333";
      ctx.stroke();
      ctx.restore();
    }

    function drawBall(metrics, motion) {
      const ball = worldBall(motion);
      const x = metrics.toScreenX(ball.x);
      const y = metrics.toScreenY(ball.y);
      const r = Math.max(10, model.ballRadius * metrics.scale);

      ctx.save();
      const gradient = ctx.createRadialGradient(x - r * 0.35, y - r * 0.38, r * 0.15, x, y, r);
      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(0.22, "#7fb2ff");
      gradient.addColorStop(0.72, "#1e6fff");
      gradient.addColorStop(1, "#0c39a8");
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = "#0b43c0";
      ctx.stroke();

      ctx.fillStyle = "#111";
      ctx.font = "700 16px Meiryo, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("小球", x, y - r - 48);
      ctx.fillText("（質量 m）", x, y - r - 25);
      ctx.restore();
    }

    function drawVelocityVectors(metrics, motion) {
      const ball = worldBall(motion);
      const platformPoint = {
        x: model.platformX + 4.0,
        y: -0.17
      };
      const factor = 0.23;

      drawVector(metrics, ball.x, ball.y + 0.08, motion.ballVx * factor, motion.ballVy * factor, "#1f6feb", "vP");
      drawVector(metrics, platformPoint.x, platformPoint.y, motion.platformV * factor, 0, "#f00808", "V");
      drawVector(metrics, ball.x, ball.y - 0.08, motion.relVx * factor, motion.relVy * factor, "#0aa13a", "vrel");
    }

    function drawForceVectors(metrics, motion) {
      const ball = worldBall(motion);
      const p = ball.profile;
      const normal = normalVector(p.slope);
      const gravityLength = -0.46;
      const normalLength = p.slope === 0 ? 0.38 : 0.5;

      drawVector(metrics, ball.x, ball.y, 0, gravityLength, "#222", "mg");
      drawVector(metrics, ball.x, ball.y, normal.x * normalLength, normal.y * normalLength, "#8a39d7", "N");
    }

    function drawVector(metrics, x, y, vx, vy, color, label) {
      const x1 = metrics.toScreenX(x);
      const y1 = metrics.toScreenY(y);
      const x2 = metrics.toScreenX(x + vx);
      const y2 = metrics.toScreenY(y + vy);
      const length = Math.hypot(x2 - x1, y2 - y1);

      if (length < 7) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x1, y1, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.75;
        ctx.fill();
        ctx.restore();
        return;
      }

      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - 14 * Math.cos(angle - Math.PI / 7), y2 - 14 * Math.sin(angle - Math.PI / 7));
      ctx.lineTo(x2 - 14 * Math.cos(angle + Math.PI / 7), y2 - 14 * Math.sin(angle + Math.PI / 7));
      ctx.closePath();
      ctx.fill();
      ctx.font = "800 14px Meiryo, sans-serif";
      ctx.fillText(label, x2 + 10, y2 - 8);
      ctx.restore();
    }

    function drawTrace(metrics) {
      if (!model.traces.length) return;
      ctx.save();
      model.traces.forEach((point, index) => {
        const alpha = 0.18 + 0.58 * (index / model.traces.length);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#4b8dff";
        ctx.beginPath();
        ctx.arc(metrics.toScreenX(point.ballX), metrics.toScreenY(point.ballY), 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f00808";
        ctx.fillRect(metrics.toScreenX(point.platformX + 0.05) - 3, metrics.toScreenY(-0.37) - 3, 6, 6);
        ctx.fillStyle = "#0aa13a";
        ctx.beginPath();
        ctx.arc(metrics.toScreenX(point.centerX), metrics.toScreenY(-0.52), 3.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawApexMark(metrics) {
      const p = profile(topQ());
      const x = model.platformX + p.x;
      const y = p.y + 0.2;
      ctx.save();
      ctx.strokeStyle = "#f0b500";
      ctx.fillStyle = "#f0b500";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(metrics.toScreenX(x), metrics.toScreenY(y + 0.12));
      ctx.lineTo(metrics.toScreenX(x - 0.08), metrics.toScreenY(y - 0.02));
      ctx.lineTo(metrics.toScreenX(x + 0.08), metrics.toScreenY(y - 0.02));
      ctx.closePath();
      ctx.fill();
      ctx.font = "800 14px Meiryo, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("最高点", metrics.toScreenX(x), metrics.toScreenY(y + 0.26));
      ctx.restore();
    }

    function updateReadout(motion = solveMotion()) {
      const relSpeed = Math.hypot(motion.relVx, motion.relVy);
      readout.ball.textContent = `(${format(motion.ballVx)}, ${format(motion.ballVy)}) m/s`;
      readout.platform.textContent = `(${format(motion.platformV)}, 0.00) m/s`;
      readout.relative.textContent = `(${format(motion.relVx)}, ${format(motion.relVy)}) m/s`;
      readout.relativeSpeed.textContent = `${format(relSpeed)} m/s`;
      readout.apexNote.classList.toggle("show", model.atApex || relSpeed < 0.08);
    }

    function animate(now) {
      const rawDt = Math.min(0.033, (now - model.lastTime) / 1000);
      model.lastTime = now;
      if (model.running) {
        step(rawDt);
      }
      draw();
      requestAnimationFrame(animate);
    }

    updateViewText();
    resizeCanvas();
    resetSimulation(false);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
